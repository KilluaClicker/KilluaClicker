<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход</title>
<style>
body{margin:0;background:#060814;color:white;font-family:Arial;text-align:center}
.box{max-width:400px;margin:70px auto;padding:25px}
input{width:100%;padding:15px;margin:7px 0;box-sizing:border-box;border:0;border-radius:12px;background:#151b2e;color:white}
button{width:100%;padding:15px;margin:7px 0;border:0;border-radius:12px;background:#00d9ff;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<h1>Вход</h1>
<input id="nick" placeholder="Ник">
<input id="pass" type="password" placeholder="Пароль">
<button onclick="login()">ВОЙТИ</button>
<button onclick="location.href='register.html'">Регистрация</button>
</div>

<script>
function login(){
    const nick=document.getElementById("nick").value.trim();
    const pass=document.getElementById("pass").value;

    let users=JSON.parse(localStorage.getItem("users")||"[]");

    const user=users.find(u=>u.nick===nick&&u.pass===pass);

    if(!user){
        alert("Неверный ник или пароль");
        return;
    }

    localStorage.setItem("currentUser",nick);
    location.href="index.html";
}
</script>
</body>
</html>
