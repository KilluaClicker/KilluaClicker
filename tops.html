<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Топ игроков</title>

<style>
body{
margin:0;
background:#060814;
color:white;
font-family:Arial;
}
.box{
width:min(700px,92%);
margin:auto;
padding:25px;
}
button{
padding:13px 18px;
border:0;
border-radius:12px;
background:#151c30;
color:white;
cursor:pointer;
}
h1{text-align:center}
.player{
display:flex;
align-items:center;
gap:15px;
padding:17px;
margin:10px 0;
border-radius:18px;
background:#101628;
}
.place{
width:45px;
font-size:22px;
font-weight:bold;
text-align:center;
}
.info{flex:1}
.nick{font-weight:bold;font-size:17px}
.stats{color:#77839b;font-size:12px;margin-top:5px}
.balance{
color:#ffe600;
font-weight:bold;
}
.first{
border:1px solid #ffd70055;
background:linear-gradient(135deg,#332c0c,#101628);
}
.second{border:1px solid #aaa5}
.third{border:1px solid #cd7f3255}
.empty{
padding:30px;
text-align:center;
color:#77839b;
}
</style>
</head>

<body>

<div class="box">

<button onclick="location.href='index.html'">
← Меню
</button>

<h1>🏆 ТОП БАЛАНСА</h1>

<div id="list"></div>

</div>

<script>

function getUsers(){

try{

const users=
JSON.parse(
localStorage.getItem("users")||"[]"
);

return Array.isArray(users)
?users
:[];

}catch{

return [];

}

}


function format(n){

return Number(n||0)
.toLocaleString("ru-RU");

}


function escapeHTML(text){

const div=
document.createElement("div");

div.textContent=text;

return div.innerHTML;

}


function render(){

const list=
document.getElementById("list");

list.innerHTML="";


let users=getUsers();


users.sort(
(a,b)=>
Number(b.coins||0)-
Number(a.coins||0)
);


if(users.length===0){

list.innerHTML=
<div class="empty">
👥 Пока нет зарегистрированных игроков.
</div>
;

return;

}


users.forEach(
(user,index)=>{

const row=
document.createElement("div");

row.className="player";


if(index===0)
row.classList.add("first");

if(index===1)
row.classList.add("second");

if(index===2)
row.classList.add("third");


let place=
index===0
?"🥇"
:index===1
?"🥈"
:index===2
?"🥉"
:index+1;


row.innerHTML=

<div class="place">
${place}
</div>

<div class="info">

<div class="nick">
${escapeHTML(user.nick||"Игрок")}
</div>

<div class="stats">
⚡ Клик: ${format(user.power)}
&nbsp; • &nbsp;
🤖 Авто: ${format(user.auto)}/сек
</div>

</div>

<div class="balance">
🪙 ${format(user.coins)}
</div>

;


list.appendChild(row);

});

}


render();

</script>

</body>
</html>
