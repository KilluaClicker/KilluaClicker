<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Магазин — KilluaClicker</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial;color:white;background:radial-gradient(circle at 20% 10%,#073c58,transparent 35%),#060810}
.wrap{width:min(700px,94%);margin:auto;padding:25px 0}
h1{text-align:center;color:#00eaff}
.balance{text-align:center;font-size:25px;color:#ffe600;margin:20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{padding:20px;border-radius:20px;background:#ffffff07;border:1px solid #ffffff0d}
.card h2{margin-top:0}
.card p{color:#8993a8}
button{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#00eaff,#536dff);font-weight:bold;cursor:pointer}
.back{margin-top:18px;background:#ffffff0a;color:white}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>🛒 Магазин</h1>
<div class="balance">🪙 <span id="coins">0</span></div>

<div class="grid">

<div class="card">
<h2>⚡ +1 к клику</h2>
<p>Увеличивает силу клика на 1.</p>
<button onclick="buyPower(1,100)">100 🪙</button>
</div>

<div class="card">
<h2>⚡ +10 к клику</h2>
<p>Увеличивает силу клика на 10.</p>
<button onclick="buyPower(10,1000)">1 000 🪙</button>
</div>

<div class="card">
<h2>⚡ +1000 к клику</h2>
<p>Большое усиление клика.</p>
<button onclick="buyPower(1000,100000)">100 000 🪙</button>
</div>

<div class="card">
<h2>⚡ +1 000 000 к клику</h2>
<p>Огромное усиление.</p>
<button onclick="buyPower(1000000,100000000)">100 000 000 🪙</button>
</div>

</div>

<button class="back" onclick="location.href='index.html'">← Меню</button>
</div>

<script>
const currentUser=localStorage.getItem("currentUser");

if(!currentUser)location.href="login.html";

function getUsers(){
try{return JSON.parse(localStorage.getItem("users")||"[]");}
catch{return [];}
}

function getUser(){
return getUsers().find(u=>u.nick===currentUser);
}

function saveUser(user){
const users=getUsers();
const i=users.findIndex(u=>u.nick===currentUser);
users[i]=user;
localStorage.setItem("users",JSON.stringify(users));
}

function update(){
const user=getUser();
document.getElementById("coins").textContent=
Number(user.coins||0).toLocaleString("ru-RU");
}

function buyPower(amount,cost){
const user=getUser();

if(Number(user.coins||0)<cost){
alert("❌ Не хватает монет!");
return;
}

user.coins-=cost;
user.power=Number(user.power||1)+amount;

saveUser(user);

alert("✅ Улучшение куплено!");
update();
}

update();
</script>
</body>
</html>
