<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Магазин — KilluaClicker</title>

<style>
body {
    margin: 0;
    background: #070914;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: min(700px, 90%);
    margin: auto;
    padding: 30px 0 100px;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 13px 18px;
    background: #141a2b;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.balance {
    color: #ffe600;
    font-size: 25px;
    font-weight: bold;
}

.card {
    margin-top: 15px;
    padding: 20px;
    border-radius: 18px;
    background: #101525;
}

.buy {
    margin-top: 15px;
    width: 100%;
    background: linear-gradient(135deg,#ffe600,#ff7900);
    color: #111;
}
</style>
</head>

<body>

<div class="container">

<button onclick="location.href='index.html'">
← Меню
</button>

<h1>🛒 Магазин</h1>

<div class="balance">
🪙 <span id="coins">0</span>
</div>


<div class="card">

<h2>⚡ +1 к клику</h2>

<p>Увеличивает силу клика на 1.</p>

<p>Цена: 10 🪙</p>

<button class="buy" onclick="buy(1,10)">
КУПИТЬ
</button>

</div>


<div class="card">

<h2>⚡ +10 к клику</h2>

<p>Увеличивает силу клика на 10.</p>

<p>Цена: 100 🪙</p>

<button class="buy" onclick="buy(10,100)">
КУПИТЬ
</button>

</div>


<div class="card">

<h2>🔥 +1000 к клику</h2>

<p>Увеличивает силу клика на 1000.</p>

<p>Цена: 10 000 🪙</p>

<button class="buy" onclick="buy(1000,10000)">
КУПИТЬ
</button>

</div>


<div class="card">

<h2>💎 +1 000 000 к клику</h2>

<p>Увеличивает силу клика на миллион.</p>

<p>Цена: 10 000 000 🪙</p>

<button class="buy" onclick="buy(1000000,10000000)">
КУПИТЬ
</button>

</div>

</div>

<script>

let coins =
Number(localStorage.getItem("coins")) || 0;

let power =
Number(localStorage.getItem("power")) || 1;


function update() {

document.getElementById("coins").textContent =
coins.toLocaleString("ru-RU");

localStorage.setItem("coins", coins);
localStorage.setItem("power", power);

}


function buy(amount, price) {

if (coins < price) {

alert("Недостаточно монет!");

return;

}

coins -= price;

power += amount;

update();

alert("Улучшение куплено!");

}


update();

</script>

</body>
</html>
