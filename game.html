<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Игра — KilluaClicker</title>
<style>
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;font-family:Arial;color:white;
background:radial-gradient(circle,#12375a,transparent 35%),#060810;
}
.wrap{width:min(600px,94%);margin:auto;padding:25px 0;text-align:center}
h1{color:#00eaff}
.coins{
font-size:42px;font-weight:900;color:#ffe600;margin:25px 0;
}
.coin{
width:210px;height:210px;border-radius:50%;border:0;
background:radial-gradient(circle at 35% 30%,#fff35a,#ff8c00 60%,#ff5b00);
font-size:70px;cursor:pointer;
box-shadow:0 0 50px #ff9d0055;
transition:.1s;
}
.coin:active{transform:scale(.92)}
.stats{
margin:25px 0;padding:20px;border-radius:20px;background:#ffffff08;
border:1px solid #ffffff0d;
}
button.back{
padding:13px 20px;border:0;border-radius:12px;background:#ffffff0b;color:white;
cursor:pointer;
}
</style>
</head>
<body>
<div class="wrap">
<h1>⚡ KilluaClicker</h1>

<div class="coins">
🪙 <span id="coins">0</span>
</div>

<button class="coin" onclick="clickCoin()">🪙</button>

<div class="stats">
<div>⚡ За клик: <b id="power">1</b></div>
<div>🤖 Автокликер: <b id="auto">0</b>/сек</div>
</div>

<button class="back" onclick="location.href='index.html'">← Меню</button>
</div>

<script>
const currentUser=localStorage.getItem("currentUser");

if(!currentUser){
location.href="login.html";
}

function getUsers(){
try{return JSON.parse(localStorage.getItem("users")||"[]");}
catch{return [];}
}

function getUser(){
return getUsers().find(u=>u.nick===currentUser);
}

function saveUser(user){
const users=getUsers();
const index=users.findIndex(u=>u.nick===currentUser);
if(index!==-1){
users[index]=user;
localStorage.setItem("users",JSON.stringify(users));
}
}

function update(){
const user=getUser();

if(!user){
location.href="login.html";
return;
}

document.getElementById("coins").textContent=
Number(user.coins||0).toLocaleString("ru-RU");

document.getElementById("power").textContent=
Number(user.power||1).toLocaleString("ru-RU");

document.getElementById("auto").textContent=
Number(user.auto||0).toLocaleString("ru-RU");
}

function clickCoin(){
const user=getUser();
user.coins=Number(user.coins0)+Number(user.power1);
saveUser(user);
update();
}

setInterval(()=>{
const user=getUser();

if(!user)return;

const auto=Number(user.auto||0);

if(auto>0){
user.coins=Number(user.coins||0)+auto;
saveUser(user);
update();
}
},1000);

update();
</script>
</body>
</html>
