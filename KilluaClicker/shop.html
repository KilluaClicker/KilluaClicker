<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Магазин</title>
<style>
body{margin:0;background:#060814;color:white;font-family:Arial}
.box{max-width:700px;margin:auto;padding:25px}
button{padding:14px;border:0;border-radius:12px;background:#151b2e;color:white;cursor:pointer;font-weight:bold}
.card{margin:15px 0;padding:20px;border-radius:18px;background:#101628}
.buy{width:100%;background:linear-gradient(135deg,#ffe600,#ff7800);color:#111}
.balance{color:#ffe600;font-size:28px;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<button onclick="location.href='index.html'">← Меню</button>
<h1>🛒 Магазин</h1>
<div class="balance">🪙 <span id="coins">0</span></div>

<div class="card"><h2>⚡ +1 к клику</h2><p>Цена: 10 🪙</p><button class="buy" onclick="buy(1,10)">КУПИТЬ</button></div>
<div class="card"><h2>⚡ +10 к клику</h2><p>Цена: 100 🪙</p><button class="buy" onclick="buy(10,100)">КУПИТЬ</button></div>
<div class="card"><h2>🔥 +1 000 к клику</h2><p>Цена: 10 000 🪙</p><button class="buy" onclick="buy(1000,10000)">КУПИТЬ</button></div>
<div class="card"><h2>💎 +1 000 000 к клику</h2><p>Цена: 10 000 000 🪙</p><button class="buy" onclick="buy(1000000,10000000)">КУПИТЬ</button></div>
<div class="card"><h2>🌌 +1 000 000 000 к клику</h2><p>Цена: 10 000 000 000 🪙</p><button class="buy" onclick="buy(1000000000,10000000000)">КУПИТЬ</button></div>
</div>

<script>
const nick=localStorage.getItem("currentUser");
if(!nick)location.href="login.html";

function users(){return JSON.parse(localStorage.getItem("users")||"[]")}
function getUser(){return users().find(u=>u.nick===nick)}
function saveUser(u){
    let a=users();
    a[a.findIndex(x=>x.nick===nick)]=u;
    localStorage.setItem("users",JSON.stringify(a));
}
function update(){
    document.getElementById("coins").textContent=getUser().coins.toLocaleString();
}
function buy(amount,price){
    let u=getUser();
    if(u.coins<price){
        alert("Недостаточно монет!");
        return;
    }
    u.coins-=price;
    u.power+=amount;
    saveUser(u);
    update();
    alert("Улучшение куплено!");
}
update();
</script>
</body>
</html>
