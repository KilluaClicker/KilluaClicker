<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Топы</title>
<style>
body{margin:0;background:#060814;color:white;font-family:Arial}
.box{max-width:600px;margin:auto;padding:25px}
button{padding:13px 18px;border:0;border-radius:12px;background:#151b2e;color:white;cursor:pointer}
.row{display:flex;justify-content:space-between;padding:18px;margin:8px 0;background:#101628;border-radius:14px}
.gold{color:#ffe600}
</style>
</head>
<body>
<div class="box">
<button onclick="location.href='index.html'">← Меню</button>
<h1>🏆 Топ по балансу</h1>
<div id="list"></div>
</div>

<script>
let users=JSON.parse(localStorage.getItem("users")||"[]");

users.sort((a,b)=>b.coins-a.coins);

const list=document.getElementById("list");

if(users.length===0){
    list.innerHTML="<p>Пока нет игроков.</p>";
}

users.forEach((u,i)=>{
    const row=document.createElement("div");
    row.className="row";

    let medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":(i+1)+".";

    row.innerHTML=
        "<span>"+medal+" "+u.nick+"</span>"+
        "<span class='gold'>🪙 "+u.coins.toLocaleString()+"</span>";

    list.appendChild(row);
});
</script>
</body>
</html>
