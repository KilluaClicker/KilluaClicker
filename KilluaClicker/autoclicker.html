<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Автокликер</title>
<style>
body{margin:0;background:#060814;color:white;font-family:Arial}
.box{max-width:650px;margin:auto;padding:25px}
button{width:100%;padding:15px;margin:8px 0;border:0;border-radius:13px;background:#151b2e;color:white;cursor:pointer;font-weight:bold}
.card{padding:20px;margin:15px 0;border-radius:18px;background:#101628}
.buy{background:linear-gradient(135deg,#00eaff,#006cff)}
.balance{color:#ffe600;font-size:28px}
</style>
</head>
<body>
<div class="box">
<button onclick="location.href='index.html'">← Меню</button>
<h1>🤖 Автокликер</h1>
<div class="balance">🪙 <span id="coins">0</span></div>
<p>Доход: <b><span id="auto">0</span></b> монет/сек</p>

<div class="card">
<h2>🤖 +1 / сек</h2>
<p>Цена: 100 🪙</p>
<button class="buy" onclick="buyAuto(1,100)">УЛУЧШИТЬ</button>
</div>

<div class="card">
<h2>🚀 +10 / сек</h2>
<p>Цена: 5 000 🪙</p>
<button class="buy" onclick="buyAuto(10,5000)">УЛУЧШИТЬ</button>
</div>

<div class="card">
<h2>💎 +1 000 000 / сек</h2>
<p>Цена: 10 000 000 🪙</p>
<button class="buy" onclick="buyAuto(1000000,10000000)">УЛУЧШИТЬ</button>
</div>

<div class="card">
<h2>🌌 +1 000 000 000 / сек</h2>
<p>Цена: 10 000 000 000 🪙</p>
<button class="buy" onclick="buyAuto(1000000000,10000000000)">УЛУЧШИТЬ</button>
</div>
</div>

<script>
const nick=localStorage.getItem("currentUser");
if(!nick)location.href="login.html";

function users(){return JSON.parse(localStorage.getItem("users")||"[]")}
function getUser(){return users().find(u=>u.nick===nick)}
function saveUser(u){
    let a=users();
    a[a.findIndex(x=>x.nick===nick)]=u;
    localStorage.setItem("users",JSON.stringify(a));
}
function update(){
    let u=getUser();
    document.getElementById("coins").textContent=u.coins.toLocaleString();
    document.getElementById("auto").textContent=u.auto.toLocaleString();
}
function buyAuto(amount,price){
    let u=getUser();
    if(u.coins<price){
        alert("Недостаточно монет!");
        return;
    }
    u.coins-=price;
    u.auto+=amount;
    saveUser(u);
    update();
    alert("Автокликер улучшен!");
}
update();
</script>
</body>
</html>
