<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Настройки</title>
<style>
body{margin:0;background:#060814;color:white;font-family:Arial;text-align:center}
.box{max-width:500px;margin:60px auto;padding:25px}
button{width:100%;padding:15px;margin:8px 0;border:0;border-radius:13px;background:#151b2e;color:white;cursor:pointer}
.danger{background:#7b1930}
</style>
</head>
<body>
<div class="box">
<button onclick="location.href='index.html'">← Меню</button>
<h1>⚙️ Настройки</h1>

<input type="file" accept="image/*" onchange="avatar(event)">

<button class="danger" onclick="resetGame()">
🗑 СБРОСИТЬ МОЙ ПРОГРЕСС
</button>
</div>

<script>
const nick=localStorage.getItem("currentUser");

if(!nick)location.href="login.html";

function avatar(event){
    const file=event.target.files[0];

    if(!file)return;

    const reader=new FileReader();

    reader.onload=function(){
        localStorage.setItem("avatar_"+nick,reader.result);
        alert("Аватарка сохранена!");
    };

    reader.readAsDataURL(file);
}

function resetGame(){
    if(!confirm("Точно сбросить прогресс?"))return;

    let users=JSON.parse(localStorage.getItem("users")||"[]");
    let u=users.find(x=>x.nick===nick);

    u.coins=0;
    u.power=1;
    u.auto=0;

    localStorage.setItem("users",JSON.stringify(users));

    alert("Прогресс сброшен!");
}
</script>
</body>
</html>
