<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Настройки — KilluaClicker</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: #070914;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    width: min(500px, 90%);
    margin: auto;
    padding: 30px 0;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border: 0;
    border-radius: 13px;
    background: #141a2b;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.reset {
    background: #7b1930;
}

input {
    margin: 25px 0;
}
</style>
</head>

<body>

<div class="container">

<button onclick="location.href='index.html'">
← Меню
</button>

<h1>⚙️ Настройки</h1>

<h3>Аватарка</h3>

<input
    type="file"
    accept="image/*"
    onchange="avatar(event)"
>

<button class="reset" onclick="resetGame()">
🗑 Сбросить прогресс
</button>

</div>

<script>

function avatar(event) {

const file = event.target.files[0];

if (!file) return;

const reader = new FileReader();

reader.onload = function() {

localStorage.setItem(
"avatar",
reader.result
);

alert("Аватарка сохранена!");

};

reader.readAsDataURL(file);

}


function resetGame() {

if (!confirm("Сбросить весь прогресс?")) {
return;
}

localStorage.clear();

alert("Прогресс сброшен!");

}

</script>

</body>
</html>
