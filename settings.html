<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Настройки — KilluaClicker</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial;color:white;background:#060810}
.box{width:min(500px,92%);padding:30px;border-radius:25px;background:#101625;border:1px solid #ffffff10}
h1{color:#00eaff;text-align:center}
button{width:100%;padding:15px;margin:7px 0;border:0;border-radius:13px;background:#ffffff08;color:white;cursor:pointer}
.danger{color:#ff6c8b;background:#ff416a12}
</style>
</head>
<body>
<div class="box">
<h1>⚙️ Настройки</h1>

<button onclick="toggleSound()">🔊 Звук</button>
<button onclick="toggleAnimation()">✨ Анимации</button>
<button class="danger" onclick="resetGame()">🗑 Сбросить прогресс</button>
<button onclick="location.href='index.html'">← Меню</button>
</div>

<script>
function toggleSound(){
const value=localStorage.getItem("sound")!=="off";
localStorage.setItem("sound",value?"off":"on");
alert(value?"🔇 Звук выключен":"🔊 Звук включён");
}

function toggleAnimation(){
const value=localStorage.getItem("animations")!=="off";
localStorage.setItem("animations",value?"off":"on");
alert(value?"✨ Анимации выключены":"✨ Анимации включены");
}

function resetGame(){
if(!confirm("Точно сбросить прогресс?"))return;

const nick=localStorage.getItem("currentUser");

if(!nick)return;

const users=JSON.parse(localStorage.getItem("users")||"[]");
const user=users.find(u=>u.nick===nick);

if(user){
user.coins=0;
user.power=1;
user.auto=0;
localStorage.setItem("users",JSON.stringify(users));
}

alert("🗑 Прогресс сброшен!");
}
</script>
</body>
</html>
