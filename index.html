<script>

/* ================= DATA ================= */

let accounts =
    JSON.parse(
        localStorage.getItem(
            "killuaAccounts"
        )
    ) || {};

let currentUser =
    localStorage.getItem(
        "killuaCurrentUser"
    );


/* ================= SCREEN ================= */

function hideAll(){

    document
        .querySelectorAll(".screen")
        .forEach(
            screen =>
                screen.classList.add("hidden")
        );

}


function showLogin(){

    hideAll();

    document
        .getElementById("authScreen")
        .classList.remove("hidden");

    document
        .getElementById("loginForm")
        .classList.remove("hidden");

    document
        .getElementById("registerForm")
        .classList.add("hidden");

}


function showRegister(){

    hideAll();

    document
        .getElementById("authScreen")
        .classList.remove("hidden");

    document
        .getElementById("loginForm")
        .classList.add("hidden");

    document
        .getElementById("registerForm")
        .classList.remove("hidden");

}


function showMenu(){

    hideAll();

    document
        .getElementById("menuScreen")
        .classList.remove("hidden");

    updateMenu();

}


function showGame(){

    hideAll();

    document
        .getElementById("gameScreen")
        .classList.remove("hidden");

    updateGame();

}


function showSettings(){

    hideAll();

    document
        .getElementById("settingsScreen")
        .classList.remove("hidden");

    document
        .getElementById("settingsUser")
        .textContent =
            accounts[currentUser].nickname;

}


/* ================= PASSWORD ================= */

async function hashPassword(password){

    const data =
        new TextEncoder()
        .encode(password);

    const hash =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    return Array.from(
        new Uint8Array(hash)
    )
    .map(
        byte =>
            byte
            .toString(16)
            .padStart(2,"0")
    )
    .join("");

}

    const nickname =

        .getElementById("registerPassword2")
        .value;

    const message =
        document

    if(nickname.length < 3){

        message.className =

        message.textContent =

        return;

    }

/* ================= LOGIN ================= */

async function login(){

    const nickname =
        document
        .getElementById("loginNick")
        .value
        .trim();

    const password =
        document
        .getElementById("loginPassword")
        .value;

    const message =
        document
        .getElementById("loginMessage");


    const key =
        nickname.toLowerCase();


    if(!accounts[key]){

        message.className =
            "message error";

        message.textContent =
            "❌ Аккаунт не найден.";

        return;

    }


    const passwordHash =
        await hashPassword(password);


    if(
        accounts[key].passwordHash
        !== passwordHash
    ){

        message.className =
            "message error";

        message.textContent =
            "❌ Неверный пароль.";

        return;

    }


    currentUser = key;

    localStorage.setItem(
        "killuaCurrentUser",
        currentUser
    );


    showMenu();

}


/* ================= GAME ================= */

function clickCoin(){

    const user =
        accounts[currentUser];

    user.coins += user.power;

    user.totalCoins += user.power;

    saveAccounts();

    updateGame();

}


function updateGame(){

    const user =
        accounts[currentUser];

    document
        .getElementById("coins")
        .textContent =
            user.coins;

    document
        .getElementById("totalCoins")
        .textContent =
            user.totalCoins;

    document
        .getElementById("power")
        .textContent =
            user.power;

}


function updateMenu(){

    document
        .getElementById("welcome")
        .textContent =
            "Добро пожаловать, "
            + accounts[currentUser].nickname
            + " ⚡";

}


/* ================= SAVE ================= */

function saveAccounts(){

    localStorage.setItem(
        "killuaAccounts",
        JSON.stringify(accounts)
    );

}


/* ================= LOGOUT ================= */

function logout(){

    currentUser = null;

    localStorage.removeItem(
        "killuaCurrentUser"
    );

    showLogin();

}


/* ================= RESET ================= */

function resetProgress(){

    if(
        !confirm(
            "Точно сбросить весь прогресс?"
        )
    ){
        return;
    }


    accounts[currentUser].coins = 0;

    accounts[currentUser].totalCoins = 0;

    accounts[currentUser].power = 1;


    saveAccounts();

    updateGame();

    alert(
        "✅ Прогресс сброшен!"
    );

}


/* ================= START ================= */

if(
    currentUser &&
    accounts[currentUser]
){

    showMenu();

}else{

    showLogin();

}

</script>
