<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KilluaClicker</title>

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#050816;
    color:white;
    font-family:Arial,sans-serif;
}

.box{
    text-align:center;
    padding:40px;
    border-radius:30px;
    background:#111a2e;
    box-shadow:0 0 60px #00eaff22;
}

h1{
    color:#00eaff;
}

#coins{
    font-size:45px;
    color:#ffd83d;
    margin:25px;
}

button{
    border:0;
    border-radius:20px;
    padding:20px 45px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    background:#00eaff;
}

button:active{
    transform:scale(.92);
}
</style>
</head>

<body>

<div class="box">

<h1>⚡ KilluaClicker</h1>

<div id="coins">🪙 0</div>

<button onclick="clickCoin()">
    🪙 КЛИК
</button>

</div>

<script>
let coins = Number(localStorage.getItem("killuaCoins")) || 0;

function update(){
    document.getElementById("coins").textContent =
        "🪙 " + coins.toLocaleString("ru-RU");
}

function clickCoin(){
    coins++;
    localStorage.setItem("killuaCoins", coins);
    update();
}

update();
</script>

</body>
</html>
