<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTIMATE CLICKER</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#070914;
    --panel:#0d1224;
    --panel2:#111831;
    --border:rgba(255,255,255,.09);
    --text:#f5f7ff;
    --muted:#8992b2;
    --purple:#8b5cf6;
    --blue:#3b82f6;
    --cyan:#22d3ee;
    --green:#22c55e;
    --red:#ef4444;
    --gold:#f59e0b;
    --pink:#ec4899;
}

body{
    min-height:100vh;
    font-family:Inter,Arial,sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at 20% 10%,rgba(124,58,237,.18),transparent 30%),
        radial-gradient(circle at 90% 80%,rgba(34,211,238,.10),transparent 30%),
        var(--bg);
    overflow-x:hidden;
}

button,input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

#app{
    min-height:100vh;
}

.bg-orb{
    position:fixed;
    width:400px;
    height:400px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.12;
    pointer-events:none;
}

.orb1{
    background:#7c3aed;
    top:-150px;
    left:-100px;
}

.orb2{
    background:#06b6d4;
    right:-150px;
    bottom:-150px;
}

/* AUTH */

.auth-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.auth-box{
    width:100%;
    max-width:460px;
    padding:38px;
    background:rgba(13,18,36,.88);
    border:1px solid var(--border);
    border-radius:28px;
    box-shadow:0 30px 100px rgba(0,0,0,.5);
    backdrop-filter:blur(20px);
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:900;
    letter-spacing:3px;
    margin-bottom:8px;
    background:linear-gradient(90deg,#a78bfa,#22d3ee,#ec4899);
    -webkit-background-clip:text;
    color:transparent;
}

.subtitle{
    text-align:center;
    color:var(--muted);
    margin-bottom:30px;
}

.tabs{
    display:flex;
    background:#080c19;
    padding:5px;
    border-radius:14px;
    margin-bottom:22px;
}

.tab{
    flex:1;
    padding:12px;
    color:var(--muted);
    background:transparent;
    border-radius:10px;
}

.tab.active{
    background:linear-gradient(135deg,#7c3aed,#2563eb);
    color:white;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    color:#aab2ce;
    font-size:13px;
    margin-bottom:7px;
}

.form-group input{
    width:100%;
    padding:14px 15px;
    border-radius:13px;
    color:white;
    background:#080c19;
    border:1px solid var(--border);
    outline:none;
}

.form-group input:focus{
    border-color:var(--purple);
    box-shadow:0 0 0 3px rgba(139,92,246,.12);
}

.primary-btn{
    width:100%;
    padding:14px;
    border-radius:14px;
    color:white;
    font-weight:800;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
    box-shadow:0 8px 25px rgba(124,58,237,.25);
    transition:.2s;
}

.primary-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 35px rgba(124,58,237,.4);
}

.error{
    color:#fb7185;
    min-height:20px;
    margin:10px 0;
    font-size:13px;
    text-align:center;
}

/* MAIN */

.layout{
    display:flex;
    min-height:100vh;
}

.sidebar{
    position:fixed;
    width:250px;
    height:100vh;
    padding:22px 15px;
    background:rgba(8,12,25,.9);
    border-right:1px solid var(--border);
    backdrop-filter:blur(20px);
    z-index:10;
}

.side-logo{
    font-weight:1000;
    font-size:20px;
    letter-spacing:2px;
    padding:12px;
    margin-bottom:25px;
    background:linear-gradient(90deg,#a78bfa,#22d3ee);
    -webkit-background-clip:text;
    color:transparent;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.nav button{
    width:100%;
    text-align:left;
    padding:13px 15px;
    color:#9da6c2;
    background:transparent;
    border-radius:12px;
    transition:.2s;
}

.nav button:hover,
.nav button.active{
    color:white;
    background:linear-gradient(90deg,rgba(124,58,237,.25),rgba(37,99,235,.12));
}

.nav .admin-nav{
    color:#fbbf24;
}

.user-mini{
    position:absolute;
    bottom:18px;
    left:15px;
    right:15px;
    padding:14px;
    border:1px solid var(--border);
    border-radius:15px;
    background:#0c1122;
}

.user-mini-name{
    font-weight:800;
}

.user-mini-role{
    font-size:12px;
    color:#a78bfa;
    margin-top:3px;
}

.main{
    margin-left:250px;
    width:calc(100% - 250px);
    padding:28px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:28px;
}

.page-title{
    font-size:28px;
    font-weight:900;
}

.top-balance{
    padding:12px 18px;
    border-radius:14px;
    background:rgba(17,24,49,.8);
    border:1px solid var(--border);
    font-weight:800;
    color:#67e8f9;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

/* DASHBOARD */

.hero{
    position:relative;
    overflow:hidden;
    padding:32px;
    border:1px solid var(--border);
    border-radius:25px;
    background:
        linear-gradient(135deg,rgba(124,58,237,.22),rgba(37,99,235,.08)),
        var(--panel);
    margin-bottom:20px;
}

.hero h1{
    font-size:38px;
    margin-bottom:8px;
}

.hero p{
    color:var(--muted);
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    padding:22px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
}

.stat-label{
    color:var(--muted);
    font-size:13px;
    margin-bottom:8px;
}

.stat-value{
    font-size:25px;
    font-weight:900;
}

/* CLICKER */

.clicker-wrap{
    min-height:450px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:20px;
}

.balance-big{
    font-size:46px;
    font-weight:1000;
    color:#67e8f9;
    text-shadow:0 0 30px rgba(34,211,238,.3);
    text-align:center;
}

.per-click{
    color:#9ca3af;
}

.click-button{
    width:230px;
    height:230px;
    border-radius:50%;
    color:white;
    font-size:30px;
    font-weight:1000;
    background:
        radial-gradient(circle at 35% 25%,#a78bfa,#7c3aed 45%,#4c1d95);
    box-shadow:
        0 0 0 12px rgba(124,58,237,.08),
        0 0 70px rgba(124,58,237,.35),
        inset 0 -15px 30px rgba(0,0,0,.25);
    transition:.08s;
}

.click-button:hover{
    transform:scale(1.04);
}

.click-button:active{
    transform:scale(.92);
}

.floating{
    position:fixed;
    pointer-events:none;
    color:#67e8f9;
    font-size:25px;
    font-weight:900;
    animation:floatUp .8s forwards;
}

@keyframes floatUp{
    from{
        opacity:1;
        transform:translateY(0) scale(1);
    }
    to{
        opacity:0;
        transform:translateY(-100px) scale(1.4);
    }
}

/* SHOP */

.shop-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:16px;
}

.shop-card{
    padding:22px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    transition:.2s;
}

.shop-card:hover{
    transform:translateY(-4px);
    border-color:rgba(139,92,246,.45);
}

.shop-icon{
    font-size:35px;
    margin-bottom:12px;
}

.shop-card h3{
    margin-bottom:7px;
}

.shop-card p{
    color:var(--muted);
    font-size:13px;
    min-height:36px;
}

.shop-price{
    color:#67e8f9;
    font-weight:900;
    margin:15px 0;
}

.buy-btn{
    width:100%;
    padding:11px;
    border-radius:11px;
    background:#18213d;
    color:white;
    font-weight:800;
}

.buy-btn:hover{
    background:#27345c;
}

.buy-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
}

/* PANELS */

.panel{
    padding:24px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    margin-bottom:18px;
}

.panel h2{
    margin-bottom:16px;
}

.row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.small-input{
    padding:11px 13px;
    border-radius:10px;
    background:#080c19;
    border:1px solid var(--border);
    color:white;
    outline:none;
}

.small-btn{
    padding:11px 14px;
    border-radius:10px;
    color:white;
    background:#1b2747;
    font-weight:700;
}

.small-btn.green{
    background:#14532d;
}

.small-btn.red{
    background:#7f1d1d;
}

.small-btn.yellow{
    background:#78350f;
}

/* PROFILE */

.profile-card{
    max-width:700px;
}

.profile-avatar{
    width:85px;
    height:85px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:1000;
    background:linear-gradient(135deg,#7c3aed,#06b6d4);
    margin-bottom:15px;
}

.profile-name{
    font-size:27px;
    font-weight:900;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:999px;
    font-size:11px;
    margin-top:7px;
    background:#312e81;
    color:#c4b5fd;
}

.badge.admin{
    background:#713f12;
    color:#fde68a;
}

/* ADMIN */

.admin-warning{
    padding:16px;
    border-radius:15px;
    background:rgba(239,68,68,.1);
    border:1px solid rgba(239,68,68,.25);
    color:#fca5a5;
    margin-bottom:20px;
}

.players{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.player{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:15px;
    border-radius:14px;
    background:#0a1020;
    border:1px solid var(--border);
}

.player-info strong{
    display:block;
}

.player-info span{
    color:var(--muted);
    font-size:12px;
}

.player-actions{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    justify-content:flex-end;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
    backdrop-filter:blur(8px);
}

.modal-box{
    width:100%;
    max-width:550px;
    background:#0d1224;
    border:1px solid var(--border);
    border-radius:22px;
    padding:25px;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.close{
    background:transparent;
    color:#9ca3af;
    font-size:25px;
}

/* RESPONSIVE */

@media(max-width:800px){
    .sidebar{
        position:relative;
        width:100%;
        height:auto;
        border-right:0;
        border-bottom:1px solid var(--border);
    }

    .layout{
        display:block;
    }

    .main{
        margin-left:0;
        width:100%;
        padding:16px;
    }

    .user-mini{
        display:none;
    }

    .nav{
        display:grid;
        grid-template-columns:repeat(2,1fr);
    }

    .stats{
        grid-template-columns:1fr;
    }

    .hero h1{
        font-size:28px;
    }

    .balance-big{
        font-size:34px;
    }

    .click-button{
        width:190px;
        height:190px;
    }

    .player{
        align-items:flex-start;
        flex-direction:column;
    }

    .player-actions{
        justify-content:flex-start;
    }
}
</style>
</head>

<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<div id="app"></div>

<script>
"use strict";

/* =========================
   DATABASE
========================= */

const DB_KEY = "ultimate_clicker_database_v1";
const SESSION_KEY = "ultimate_clicker_session_v1";

const SHOP = [
    {id:"x1", name:"×1", power:1, price:0, icon:"⚡"},
    {id:"x100", name:"×100", power:100, price:1000, icon:"🔥"},
    {id:"x1000", name:"×1 000", power:1000, price:10000, icon:"💎"},
    {id:"x1m", name:"×1 000 000", power:1000000, price:1000000, icon:"🚀"},
    {id:"x1b", name:"×1 000 000 000", power:1000000000, price:1000000000, icon:"🌌"},
    {id:"x1t", name:"×1 триллион", power:1000000000000, price:1000000000000, icon:"🌠"},
    {id:"x1q", name:"×1 квадриллион", power:1000000000000000, price:1000000000000000, icon:"🪐"},
    {id:"x1s", name:"×1 секстиллион", power:1000000000000000000000, price:1000000000000000000000, icon:"👑"}
];

let db = loadDB();
let currentUser = null;
let currentPage = "home";
let selectedPlayer = null;

/* =========================
   STORAGE
========================= */

function loadDB(){
    try{
        const raw = localStorage.getItem(DB_KEY);

        if(raw){
            return JSON.parse(raw);
        }
    }catch(e){}

    return {
        users:[
            {
                username:"Killua666",
                password:"change-me",
                balance:1000000,
                perClick:1,
                admin:true,
                banned:false,
                created:Date.now()
            }
        ]
    };
}

function saveDB(){
    localStorage.setItem(DB_KEY, JSON.stringify(db));
}

function saveSession(){
    if(currentUser){
        localStorage.setItem(SESSION_KEY,currentUser.username);
    }else{
        localStorage.removeItem(SESSION_KEY);
    }
}

function getUser(username){
    return db.users.find(u =>
        u.username.toLowerCase() === username.toLowerCase()
    );
}

function formatNumber(value){
    if(typeof value !== "number") value = Number(value) || 0;

    if(!Number.isFinite(value)) return "∞";

    const abs = Math.abs(value);

    const units = [
        [1e21,"секст."],
        [1e18,"квинт."],
        [1e15,"квадр."],
        [1e12,"трлн"],
        [1e9,"млрд"],
        [1e6,"млн"],
        [1e3,"тыс"]
    ];

    for(const [n,name] of units){
        if(abs >= n){
            const x = value / n;
            return x.toLocaleString("ru-RU",{
                maximumFractionDigits:2
            }) + " " + name;
        }
    }

    return Math.floor(value).toLocaleString("ru-RU");
}

/* =========================
   AUTH
========================= */

function authScreen(){
    document.getElementById("app").innerHTML = `
        <div class="auth-screen">
            <div class="auth-box">
                <div class="logo">ULTIMATE CLICKER</div>
                <div class="subtitle">Кликай. Улучшай. Становись легендой.</div>

                <div class="tabs">
                    <button class="tab active" id="loginTab">Вход</button>
                    <button class="tab" id="registerTab">Регистрация</button>
                </div>

                <form id="authForm">
                    <div class="form-group">
                        <label>Никнейм</label>
                        <input id="authUsername" autocomplete="username" required maxlength="24">
                    </div>

                    <div class="form-group">
                        <label>Пароль</label>
                        <input id="authPassword" type="password" autocomplete="current-password" required minlength="4">
                    </div>

                    <div id="authError" class="error"></div>

                    <button class="primary-btn" id="authSubmit">
                        Войти
                    </button>
                </form>
            </div>
        </div>
    `;

    let mode = "login";

    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const submit = document.getElementById("authSubmit");
    const form = document.getElementById("authForm");

    loginTab.onclick = () => {
        mode = "login";
        loginTab.classList.add("active");
        registerTab.classList.remove("active");
        submit.textContent = "Войти";
        document.getElementById("authError").textContent = "";
    };

    registerTab.onclick = () => {
        mode = "register";
        registerTab.classList.add("active");
        loginTab.classList.remove("active");
        submit.textContent = "Создать аккаунт";
        document.getElementById("authError").textContent = "";
    };

    form.onsubmit = e => {
        e.preventDefault();

        const username = document.getElementById("authUsername").value.trim();
        const password = document.getElementById("authPassword").value;

        if(username.length < 3){
            return showAuthError("Никнейм должен содержать минимум 3 символа.");
        }

        if(password.length < 4){
            return showAuthError("Пароль должен содержать минимум 4 символа.");
        }

        if(mode === "register"){
            if(getUser(username)){
                return showAuthError("Такой пользователь уже существует.");
            }

            db.users.push({
                username,
                password,
                balance:0,
                perClick:1,
                admin:false,
                banned:false,
                created:Date.now()
            });

            saveDB();

            alert("Аккаунт создан! Теперь войдите.");
            loginTab.click();
            document.getElementById("authUsername").value = username;
            document.getElementById("authPassword").value = "";
        }else{
            const user = getUser(username);

            if(!user || user.password !== password){
                return showAuthError("Неверный никнейм или пароль.");
            }

            if(user.banned){
                return showAuthError("Этот аккаунт заблокирован.");
            }

            currentUser = user;
            saveSession();
            renderApp();
        }
    };
}

function showAuthError(msg){
    document.getElementById("authError").textContent = msg;
}

/* =========================
   APP
========================= */

function renderApp(){
    currentUser = getUser(currentUser.username);

    if(!currentUser || currentUser.banned){
        logout();
        return;
    }

    document.getElementById("app").innerHTML = `
        <div class="layout">

            <aside class="sidebar">
                <div class="side-logo">⚡ CLICKER</div>

                <div class="nav">
                    <button data-page="home">🏠 Главное меню</button>
                    <button data-page="game">🎮 Играть</button>
                    <button data-page="shop">🛒 Магазин</button>
                    <button data-page="profile">👤 Профиль</button>

                    ${
                        currentUser.admin
                        ? `<button class="admin-nav" data-page="admin">🛡 Админ-панель</button>`
                        : ""
                    }

                    <button id="logoutBtn">🚪 Выйти</button>
                </div>

                <div class="user-mini">
                    <div class="user-mini-name">${escapeHTML(currentUser.username)}</div>
                    <div class="user-mini-role">
                        ${currentUser.admin ? "Администратор" : "Игрок"}
                    </div>
                </div>
            </aside>

            <main class="main">
                <div class="topbar">
                    <div class="page-title" id="pageTitle">Главное меню</div>
                    <div class="top-balance">
                        💰 <span id="topBalance">0</span>
                    </div>
                </div>

                <section class="page" id="page-home"></section>
                <section class="page" id="page-game"></section>
                <section class="page" id="page-shop"></section>
                <section class="page" id="page-profile"></section>

                ${
                    currentUser.admin
                    ? `<section class="page" id="page-admin"></section>`
                    : ""
                }
            </main>
        </div>

        <div id="modalContainer"></div>
    `;

    document.querySelectorAll("[data-page]").forEach(btn => {
        btn.onclick = () => openPage(btn.dataset.page);
    });

    document.getElementById("logoutBtn").onclick = logout;

    renderAllPages();
    openPage(currentPage);
}

function renderAllPages(){
    renderHome();
    renderGame();
    renderShop();
    renderProfile();

    if(currentUser.admin){
        renderAdmin();
    }

    updateHeader();
}

function openPage(page){
    if(page === "admin" && !currentUser.admin){
        page = "home";
    }

    currentPage = page;

    document.querySelectorAll(".page").forEach(x =>
        x.classList.remove("active")
    );

    const target = document.getElementById("page-" + page);

    if(target) target.classList.add("active");

    document.querySelectorAll("[data-page]").forEach(x =>
        x.classList.toggle("active",x.dataset.page === page)
    );

    const titles = {
        home:"Главное меню",
        game:"Игра",
        shop:"Магазин",
        profile:"Профиль",
        admin:"Админ-панель"
    };

    document.getElementById("pageTitle").textContent =
        titles[page] || "Ultimate Clicker";
}

/* =========================
   HOME
========================= */

function renderHome(){
    document.getElementById("page-home").innerHTML = `
        <div class="hero">
            <h1>Добро пожаловать, ${escapeHTML(currentUser.username)} 👋</h1>
            <p>Твой путь к самому большому числу начинается прямо сейчас.</p>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-label">Текущий баланс</div>
                <div class="stat-value" id="homeBalance">0</div>
            </div>

            <div class="stat">
                <div class="stat-label">За один клик</div>
                <div class="stat-value" id="homePower">0</div>

function clickGame(e){
    currentUser.balance += currentUser.perClick;

    saveDB();
    updateHeader();

    document.getElementById("gameBalance").textContent =
        formatNumber(currentUser.balance);

    document.getElementById("gamePower").textContent =
        formatNumber(currentUser.perClick);

    const floating = document.createElement("div");
    floating.className = "floating";
    floating.textContent = "+" + formatNumber(currentUser.perClick);

    floating.style.left = (e.clientX - 20) + "px";
    floating.style.top = (e.clientY - 20) + "px";

    document.body.appendChild(floating);

    setTimeout(() => floating.remove(),800);

/* =========================
   SHOP
========================= */

function renderShop(){
    const html = SHOP.map(item => `
        <div class="shop-card">
            <div class="shop-icon">${item.icon}</div>
            <h3>${item.name} за клик</h3>
            <p>
                Устанавливает силу клика на
                <b>${formatNumber(item.power)}</b>.
            </p>

            <div class="shop-price">
                ${
                    item.price === 0
                    ? "БЕСПЛАТНО"
                    : "💰 " + formatNumber(item.price)
                }
            </div>

            <button
                class="buy-btn"
                data-buy="${item.id}"
                ${currentUser.balance < item.price ? "disabled" : ""}
            >
                Купить
            </button>
        </div>
    `).join("");

    document.getElementById("page-shop").innerHTML = `
        <div class="panel">
            <h2>🛒 Магазин улучшений</h2>
            <p style="color:var(--muted)">
                Покупай новые уровни силы клика.
            </p>
        </div>

        <div class="shop-grid">
            ${html}
        </div>

        <div class="panel" style="margin-top:20px">
            <h2>🚀 Максимальная прокачка</h2>
            <p style="color:var(--muted);margin-bottom:15px">
                Потратить все доступные деньги на максимально возможное
                улучшение клика.
            </p>

            <button class="primary-btn" style="max-width:350px" id="maxUpgrade">
                ⚡ ПРОКАЧАТЬ НА ВСЕ ДЕНЬГИ
            </button>
        </div>
    `;

    document.querySelectorAll("[data-buy]").forEach(btn => {
        btn.onclick = () => buyUpgrade(btn.dataset.buy);
    });

    document.getElementById("maxUpgrade").onclick = maxUpgrade;
}

function buyUpgrade(id){
    const item = SHOP.find(x => x.id === id);

    if(!item) return;

    if(item.price > currentUser.balance){
        alert("Недостаточно денег.");
        return;
    }

    if(item.power <= currentUser.perClick){
        alert("У тебя уже есть такое или более мощное улучшение.");
        return;
    }

    currentUser.balance -= item.price;
    currentUser.perClick = item.power;

    saveDB();

    renderAllPages();
    openPage("shop");
}

function maxUpgrade(){
    let affordable = SHOP
        .filter(x =>
            x.power > currentUser.perClick &&
            x.price <= currentUser.balance
        )
        .sort((a,b) => b.power - a.power);

    if(!affordable.length){
        alert("Сейчас нет доступного более мощного улучшения.");
        return;
    }

    const best = affordable[0];

    currentUser.balance -= best.price;
    currentUser.perClick = best.power;

    saveDB();

    alert(
        "Готово! Сила клика: " +
        formatNumber(currentUser.perClick)
    );

    renderAllPages();
    openPage("shop");
}

function openPlayerAdmin(encoded){

    const user = getUser(username);

    if(!user) return;

    selectedPlayer = username;

    document.getElementById("modalContainer").innerHTML = `
        <div class="modal">
            <div class="modal-box">
                <div class="modal-head">
                    <h2>⚙ ${escapeHTML(user.username)}</h2>
                    <button class="close" onclick="closeModal()">×</button>
                </div>

                <div class="panel">
                    <p style="color:var(--muted)">
                        Баланс
                    </p>

                    <h2>${formatNumber(user.balance)}</h2>

                    <div class="row">
                        <input
                            class="small-input"
                            id="balanceAmount"
                            type="number"
                            min="0"
                            placeholder="Количество">

                        <button class="small-btn green" onclick="addBalance()">
                            + Выдать
                        </button>

                        <button class="small-btn red" onclick="removeBalance()">
                            − Забрать
                        </button>

                        <button class="small-btn yellow" onclick="setBalance()">
                            = Установить
                        </button>
                    </div>
                </div>

                <div class="panel">
                    <p style="color:var(--muted)">
                        Сила клика
                    </p>

                    <h2>${formatNumber(user.perClick)}</h2>

                    <div class="row">
                        <input
                            class="small-input"
                            id="powerAmount"
                            type="number"
                            min="1"
                            placeholder="Новая сила">

                        <button class="small-btn" onclick="setPower()">
                            ⚡ Установить
                        </button>
                    </div>
                </div>

                <div class="panel">
                    <h3>🛡 Права</h3>

                    <div class="row" style="margin-top:12px">
                        <button
                            class="small-btn"
                            onclick="toggleAdmin('${encodeURIComponent(user.username)}');closeModal();">
                            ${user.admin ? "⬇ Снять админа" : "⬆ Выдать админа"}
                        </button>

                        <button
                            class="small-btn ${user.banned ? "green" : "red"}"
                            onclick="toggleBan('${encodeURIComponent(user.username)}');closeModal();">
                            ${user.banned ? "🔓 Разбанить" : "🔒 Забанить"}
                        </button>
                    </div>
                </div>

                <div style="color:#7f8aaa;font-size:12px">
                    Пароли пользователей намеренно не показываются.
                    Для безопасности используется изменение пароля самим владельцем аккаунта.
                </div>
            </div>
        </div>
    `;
}

function closeModal(){
    document.getElementById("modalContainer").innerHTML = "";
    selectedPlayer = null;
}

function getSelectedAdminUser(){
    if(!selectedPlayer) return null;

    return getUser(selectedPlayer);
}

function getAmount(id){
    const value = Number(document.getElementById(id).value);

    if(!Number.isFinite(value) || value < 0){
        alert("Введите корректное число.");
        return null;
    }

    return value;
}

function addBalance(){
    const user = getSelectedAdminUser();
    const amount = getAmount("balanceAmount");

    if(!user || amount === null) return;

    user.balance += amount;
    saveDB();

    closeModal();
    renderAllPages();
    openPage("admin");
}

function removeBalance(){
    const user = getSelectedAdminUser();
    const amount = getAmount("balanceAmount");

    if(!user || amount === null) return;

    user.balance = Math.max(0,user.balance - amount);

    saveDB();

    closeModal();
    renderAllPages();
    openPage("admin");
}

function setBalance(){
    const user = getSelectedAdminUser();
    const amount = getAmount("balanceAmount");

    if(!user || amount === null) return;

    user.balance = amount;

    saveDB();

    closeModal();
    renderAllPages();
    openPage("admin");
}

function setPower(){
    const user = getSelectedAdminUser();
    const amount = getAmount("powerAmount");

    if(!user || amount === null || amount < 1) return;

    user.perClick = amount;

    saveDB();

    closeModal();
    renderAllPages();
    openPage("admin");
}

function quickBalance(encoded){
    const username = decodeURIComponent(encoded);
    const user = getUser(username);

    if(!user) return;

    const amount = prompt(
        "Введите новый баланс для " + user.username,
        user.balance
    );

    if(amount === null) return;

    const value = Number(amount);

    if(!Number.isFinite(value) || value < 0){
        alert("Некорректное число.");
        return;
    }

    user.balance = value;

    saveDB();
    renderAllPages();
    openPage("admin");
}

function toggleBan(encoded){
    const username = decodeURIComponent(encoded);
    const user = getUser(username);

    if(!user) return;

    if(user.username === "Killua666"){
        alert("Главный аккаунт нельзя заблокировать.");
        return;
    }

    user.banned = !user.banned;

    saveDB();

    renderAllPages();
    openPage("admin");
}

function toggleAdmin(encoded){
    const username = decodeURIComponent(encoded);
    const user = getUser(username);

    if(!user) return;

    if(user.username === "Killua666"){
        alert("Главного администратора нельзя лишить админки.");
        return;
    }

    user.admin = !user.admin;

    saveDB();

    renderAllPages();
    openPage("admin");
}

/* =========================
   SESSION
========================= */

function logout(){
    currentUser = null;
    localStorage.removeItem(SESSION_KEY);
    authScreen();
}

function tryRestoreSession(){
    const username = localStorage.getItem(SESSION_KEY);

    if(!username){
        authScreen();
        return;
    }

    const user = getUser(username);

    if(!user || user.banned){
        localStorage.removeItem(SESSION_KEY);
        authScreen();
        return;
    }

    currentUser = user;
    renderApp();
}

/* =========================
   HELPERS
========================= */

function updateHeader(){
    if(!currentUser) return;

    const top = document.getElementById("topBalance");

    if(top){
        top.textContent = formatNumber(currentUser.balance);
    }

    const homeBalance = document.getElementById("homeBalance");
    const homePower = document.getElementById("homePower");

    if(homeBalance){
        homeBalance.textContent = formatNumber(currentUser.balance);
    }

    if(homePower){
        homePower.textContent = formatNumber(currentUser.perClick);
    }

    const gameBalance = document.getElementById("gameBalance");
    const gamePower = document.getElementById("gamePower");

    if(gameBalance){
        gameBalance.textContent = formatNumber(currentUser.balance);
    }

    if(gamePower){
        gamePower.textContent = formatNumber(currentUser.perClick);
    }
}

function escapeHTML(value){
    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

window.openPlayerAdmin = openPlayerAdmin;
window.closeModal = closeModal;
window.addBalance = addBalance;
window.removeBalance = removeBalance;
window.setBalance = setBalance;
window.setPower = setPower;
window.quickBalance = quickBalance;
window.toggleBan = toggleBan;
window.toggleAdmin = toggleAdmin;

tryRestoreSession();
