<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ultimate Clicker</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 10% 10%,#482080 0,transparent 35%),
        radial-gradient(circle at 90% 90%,#07516b 0,transparent 35%),
        #050713;
}

button,input{font:inherit}
button{cursor:pointer}

.hidden{display:none!important}

/* AUTH */

.auth{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.auth-box{
    width:100%;
    max-width:430px;
    padding:32px;
    border-radius:26px;
    background:#0d1224;
    border:1px solid #2b3454;
    box-shadow:0 30px 100px #000b;
}

.logo{
    text-align:center;
    font-size:29px;
    font-weight:900;
    color:#a78bfa;
}

.subtitle{
    text-align:center;
    color:#8f98b6;
    margin:8px 0 25px;
}

.tabs{
    display:flex;
    gap:5px;
    padding:5px;
    margin-bottom:20px;
    border-radius:12px;
    background:#080b17;
}

.tabs button{
    flex:1;
    padding:12px;
    border:0;
    border-radius:9px;
    color:#8f98b6;
    background:transparent;
}

.tabs button.active{
    color:#fff;
    background:#7048e8;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    margin-bottom:7px;
    color:#aeb6d0;
    font-size:13px;
}

input{
    width:100%;
    padding:13px;
    border-radius:12px;
    outline:none;
    border:1px solid #29324f;
    color:#fff;
    background:#080b17;
}

input:focus{
    border-color:#7c3aed;
}

.primary{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    color:#fff;
    font-weight:900;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
}

.error{
    min-height:20px;
    color:#fb7185;
    text-align:center;
    margin:8px 0;
}

/* LAYOUT */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:240px;
    padding:20px 14px;
    background:#080b18ee;
    border-right:1px solid #202640;
}

.side-logo{
    padding:10px;
    margin-bottom:25px;
    color:#a78bfa;
    font-size:22px;
    font-weight:900;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.nav button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:11px;
    color:#9099b7;
    text-align:left;
    background:transparent;
}

.nav button:hover,
.nav button.active{
    color:#fff;
    background:#171d36;
}

.nav .admin-btn{
    color:#fbbf24;
}

.mini-user{
    position:absolute;
    left:15px;
    right:15px;
    bottom:15px;
    padding:13px;
    border-radius:12px;
    background:#11162a;
    border:1px solid #222945;
}

.muted{
    color:#8992b2;
}

.main{
    width:calc(100% - 240px);
    margin-left:240px;
    padding:25px;
}

.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:25px;
}

.title{
    font-size:28px;
    font-weight:900;
}

.balance{
    padding:12px 18px;
    border-radius:12px;
    color:#67e8f9;
    font-weight:900;
    background:#111831;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

/* CARDS */

.hero,
.panel,
.card,
.stat{
    padding:22px;
    border-radius:20px;
    background:#0d1224;
    border:1px solid #222945;
    margin-bottom:18px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.stat small{
    color:#8992b2;
}

.stat strong{
    display:block;
    margin-top:8px;
    font-size:25px;
}

/* GAME */

.play{
    min-height:470px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:20px;
}

.big-number{
    color:#67e8f9;
    font-size:43px;
    font-weight:900;
}

.click-button{
    width:230px;
    height:230px;
    border:0;
    border-radius:50%;
    color:#fff;
    font-size:28px;
    font-weight:900;
    background:radial-gradient(
        circle at 30% 25%,
        #c4b5fd,
        #7c3aed 45%,
        #4c1d95
    );
    box-shadow:0 0 70px #7c3aed66;
    transition:.08s;
}

.click-button:active{
    transform:scale(.93);
}

/* SHOP */

.shop{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.buy{
    width:100%;
    padding:11px;
    border:0;
    border-radius:10px;
    color:#fff;
    font-weight:800;
    background:#202c4c;
}

.buy:hover:not(:disabled){
    background:#304269;
}

.buy:disabled{
    opacity:.45;
    cursor:not-allowed;
}

/* ADMIN */

.players{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.player{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:15px;
    border-radius:13px;
    background:#090f20;
    border:1px solid #202943;
}

.player-name{
    font-weight:900;
}

.player-info{
    margin-top:6px;
    color:#8992b2;
    font-size:12px;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.small{
    padding:10px 13px;
    border:0;
    border-radius:10px;
    color:#fff;
    background:#202c4c;
    font-weight:800;
}

.small:hover{
    background:#304269;
}

.green{
    background:#166534;
}

.red{
    background:#991b1b;
}

.yellow{
    background:#92400e;
}

/* MODAL */

.modal-bg{
    position:fixed;
    z-index:100;
    inset:0;
    padding:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000b;
}

.modal{
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow:auto;
    padding:24px;
    border-radius:20px;
    background:#0d1224;
    border:1px solid #29314e;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.close{
    border:0;
    color:#8992b2;
    background:transparent;
    font-size:28px;
}

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:200;
    padding:14px 18px;
    border-radius:12px;
    background:#111831;
    border:1px solid #34405f;
}

/* MOBILE */

@media(max-width:750px){

    .sidebar{
        position:relative;
        width:100%;
        bottom:auto;
    }

    .mini-user{
        display:none;
    }

    .main{
        width:100%;
        margin:0;
        padding:15px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .player{
        flex-direction:column;
        align-items:flex-start;
    }

    .title{
        font-size:22px;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

/* =========================================================
   ЛОКАЛЬНАЯ БАЗА
   ========================================================= */

const DB_KEY = "ULTIMATE_CLICKER_ACCOUNTS_V1";
const SESSION_KEY = "ULTIMATE_CLICKER_SESSION_V1";

const ADMIN_NAME = "Killua666";

let accounts = [];
let me = null;
let currentPage = "home";
let registerMode = false;


/* =========================================================
   SHOP
   ========================================================= */

const SHOP = [

    {
        name:"+1",
        power:1,
        price:10
    },

    {
        name:"+100",
        power:100,
        price:1000
    },

    {
        name:"+1 000",
        power:1000,
        price:10000
    },

    {
        name:"+1 000 000",
        power:1000000,
        price:1000000
    },

    {
        name:"+1 миллиард",
        power:1000000000,
        price:1000000000
    },

    {
        name:"+1 триллион",
        power:1000000000000,
        price:1000000000000
    },

    {
        name:"+1 квадриллион",
        power:1000000000000000,
        price:1000000000000000
    },

    {
        name:"+1 секстиллион",
        power:1000000000000000000000,
        price:1000000000000000000000
    }
];


/* =========================================================
   LOCAL STORAGE
   ========================================================= */

function loadAccounts(){

    try{

        const raw =
            localStorage.getItem(DB_KEY);

        accounts =
            raw ? JSON.parse(raw) : [];

        if(!Array.isArray(accounts)){
            accounts=[];
        }

    }catch(e){

        console.error(e);

        accounts=[];
    }
}

function saveAccounts(){

    localStorage.setItem(
        DB_KEY,
        JSON.stringify(accounts)
    );
}

function saveSession(){

    if(me){
        localStorage.setItem(
            SESSION_KEY,
            me.id
        );
    }else{
        localStorage.removeItem(
            SESSION_KEY
        );
    }
}

function getSession(){

    return localStorage.getItem(
        SESSION_KEY
    );
}


/* =========================================================
   HELPERS
   ========================================================= */

function id(){

    return Date.now().toString(36)
        +"_"+Math.random()
        .toString(36)
        .slice(2);
}

function hashPassword(password){

    /*
       Это НЕ настоящая серверная защита.
       Для локальной версии пароль хранится
       в браузере в виде простого SHA-256.
    */

    const encoder =
        new TextEncoder();

    return crypto.subtle.digest(
        "SHA-256",
        encoder.encode(password)
    ).then(buffer=>{

        return Array.from(
            new Uint8Array(buffer)
        )
        .map(x=>x.toString(16).padStart(2,"0"))
        .join("");

    });
}

function num(value){

    const n=Number(value)||0;

    const units=[
        [1e21,"секст."],
        [1e18,"квинт."],
        [1e15,"квадр."],
        [1e12,"трлн"],
        [1e9,"млрд"],
        [1e6,"млн"],
        [1e3,"тыс."]
    ];

    for(const [unit,name] of units){

        if(n>=unit){

            return (
                (n/unit).toLocaleString(
                    "ru-RU",
                    {
                        maximumFractionDigits:2
                    }
                )
                +" "
                +name
            );
        }
    }

    return n.toLocaleString("ru-RU");
}

function esc(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function toast(message){

    document
        .querySelector(".toast")
        ?.remove();

    const el=
        document.createElement("div");

    el.className="toast";
    el.textContent=message;

    document.body.appendChild(el);

    setTimeout(()=>{
        el.remove();
    },2500);
}

function refreshMe(){

    if(!me)return;

    const fresh=
        accounts.find(
            x=>x.id===me.id
        );

    if(fresh){
        me=fresh;
    }
}


/* =========================================================
   AUTH SCREEN
   ========================================================= */

function showAuth(){

    document.getElementById("app")
    .innerHTML=`

        <div class="auth">

            <div class="auth-box">

                <div class="logo">
                    ⚡ ULTIMATE CLICKER
                </div>

                <div class="subtitle">
                    Локальная версия
                </div>

                <div class="tabs">

                    <button
                        id="loginTab"
                        class="active">
                        Вход
                    </button>

                    <button
                        id="registerTab">
                        Регистрация
                    </button>

                </div>

                <form id="authForm">

                    <div class="field">

                        <label>
                            Никнейм
                        </label>

                        <input
                            id="username"
                            minlength="3"
                            maxlength="24"
                            autocomplete="username"
                            required>

                    </div>

                    <div class="field">

                        <label>
                            Пароль
                        </label>

                        <input
                            id="password"
                            type="password"
                            minlength="6"
                            autocomplete="current-password"
                            required>

                    </div>

                    <div
                        id="authError"
                        class="error">
                    </div>

                    <button
                        id="authButton"
                        class="primary">
                        Войти
                    </button>

                </form>

            </div>

        </div>
    `;

    const loginTab =
        document.getElementById(
            "loginTab"
        );

    const registerTab =
        document.getElementById(
            "registerTab"
        );

    const button =
        document.getElementById(
            "authButton"
        );

    const form =
        document.getElementById(
            "authForm"
        );

    const error =
        document.getElementById(
            "authError"
        );

    loginTab.onclick=()=>{

        registerMode=false;

        loginTab.classList.add(
            "active"
        );

        registerTab.classList.remove(
            "active"
        );

        button.textContent="Войти";
    };

    registerTab.onclick=()=>{

        registerMode=true;

        registerTab.classList.add(
            "active"
        );

        loginTab.classList.remove(
            "active"
        );

        button.textContent=
            "Создать аккаунт";
    };

    form.onsubmit=async e=>{

        e.preventDefault();

        error.textContent="";

        const username=
            document
            .getElementById("username")
            .value
            .trim();

        const password=
            document
            .getElementById("password")
            .value;

        if(!/^[a-zA-Z0-9_]+$/.test(username)){

            error.textContent=
                "Используй только A-Z, a-z, 0-9 и _.";

            return;
        }

        if(password.length<6){

            error.textContent=
                "Пароль должен быть минимум 6 символов.";

            return;
        }

        button.disabled=true;

        try{

            const existing=
                accounts.find(
                    x=>
                        x.username.toLowerCase()
                        ===
                        username.toLowerCase()
                );

            /* =========================
               РЕГИСТРАЦИЯ
               ========================= */

            if(registerMode){

                if(existing){

                    error.textContent=
                        "Такой игрок уже существует.";

                    return;
                }

                const passwordHash=
                    await hashPassword(
                        password
                    );

                const isAdmin=
                    username.toLowerCase()
                    ===
                    ADMIN_NAME.toLowerCase();

                const player={

                    id:id(),

                    username,

                    passwordHash,

                    balance:0,

                    per_click:1,

                    is_admin:isAdmin,

                    is_banned:false,

                    created_at:
                        new Date().toISOString()

                };

                accounts.push(player);

                saveAccounts();

                me=player;

                saveSession();

                currentPage="home";

                renderApp();

                toast(
                    isAdmin
                    ?"👑 Вы вошли как главный администратор!"
                    :"✅ Аккаунт создан!"
                );

                return;
            }


            /* =========================
               ВХОД
               ========================= */

            if(!existing){

                error.textContent=
                    "Игрок с таким ником не найден.";

                return;
            }

            if(existing.is_banned){

                error.textContent=
                    "Этот аккаунт заблокирован.";

                return;
            }

            const passwordHash=
                await hashPassword(
                    password
                );

            if(
                existing.passwordHash
                !==
                passwordHash
            ){

                error.textContent=
                    "Неверный пароль.";

                return;
            }

            me=existing;

            saveSession();

            currentPage="home";

            renderApp();

            toast(
                "👋 Добро пожаловать, "
                +existing.username+"!"
            );

        }catch(err){

            console.error(err);

            error.textContent=
                "Произошла ошибка.";

        }finally{

            button.disabled=false;

        }
    };
}


/* =========================================================
   APP
   ========================================================= */

function renderApp(){

    refreshMe();

    document.getElementById("app")
    .innerHTML=`

        <aside class="sidebar">

            <div class="side-logo">
                ⚡ CLICKER
            </div>

            <div class="nav">

                <button
                    data-page="home">
                    🏠 Главное меню
                </button>

                <button
                    data-page="game">
                    🎮 Играть
                </button>

                <button
                    data-page="shop">
                    🛒 Магазин
                </button>

                <button
                    data-page="profile">
                    👤 Профиль
                </button>

                ${
                    me.is_admin
                    ?`
                    <button
                        class="admin-btn"
                        data-page="admin">
                        🛡 Админ-панель
                    </button>
                    `
                    :""
                }

                <button id="logout">
                    🚪 Выйти
                </button>

            </div>

            <div class="mini-user">

                <b>
                    ${esc(me.username)}
                </b>

                <div class="muted">
                    ${
                        me.is_admin
                        ?"🛡 Администратор"
                        :"⭐ Игрок"
                    }
                </div>

            </div>

        </aside>


        <main class="main">

            <div class="top">

                <div
                    id="pageTitle"
                    class="title">
                    Главное меню
                </div>

                <div class="balance">

                    💰
                    <span id="balance">
                        ${num(me.balance)}
                    </span>

                </div>

            </div>


            <section
                id="home"
                class="page">
            </section>

            <section
                id="game"
                class="page">
            </section>

            <section
                id="shop"
                class="page">
            </section>

            <section
                id="profile"
                class="page">
            </section>

            ${
                me.is_admin
                ?`
                <section
                    id="admin"
                    class="page">
                </section>
                `
                :""
            }

        </main>

        <div id="modal"></div>
    `;


    document
        .querySelectorAll("[data-page]")
        .forEach(button=>{

            button.onclick=()=>{

                openPage(
                    button.dataset.page
                );

            };

        });


    document
        .getElementById("logout")
        .onclick=logout;


    renderHome();
    renderGame();
    renderShop();
    renderProfile();

    if(me.is_admin){
        renderAdmin();
    }

    openPage(currentPage);
}


/* =========================================================
   LOGOUT
   ========================================================= */

function logout(){

    me=null;

    localStorage.removeItem(
        SESSION_KEY
    );

    currentPage="home";

    showAuth();

    toast("Вы вышли из аккаунта.");
}


/* =========================================================
   HOME
   ========================================================= */

function renderHome(){

    document.getElementById("home")
    .innerHTML=`

        <div class="hero">

            <h1>
                Добро пожаловать,
                ${esc(me.username)} 👋
            </h1>

            <p class="muted">
                Нажимай, зарабатывай и
                прокачивай силу клика.
            </p>

        </div>


        <div class="stats">

            <div class="stat">

                <small>
                    Баланс
                </small>

                <strong>
                    ${num(me.balance)}
                </strong>

            </div>


            <div class="stat">

                <small>
                    За клик
                </small>

                <strong>
                    ${num(me.per_click)}
                </strong>

            </div>


            <div class="stat">

                <small>
                    Статус
                </small>

                <strong>
                    ${
                        me.is_admin
                        ?"🛡 ADMIN"
                        :"⭐ PLAYER"
                    }
                </strong>

            </div>

        </div>


        <div class="panel">

            <h2>
                🎮 Начать игру
            </h2>

            <p class="muted">
                Зарабатывай баланс и
                покупай силу клика.
            </p>

            <button
                class="primary"
                style="max-width:320px"
                onclick="openPage('game')">
                НАЧАТЬ ИГРАТЬ
            </button>

        </div>
    `;
}


/* =========================================================
   GAME
   ========================================================= */

function renderGame(){

    document.getElementById("game")
    .innerHTML=`

        <div class="panel play">

            <div
                id="gameBalance"
                class="big-number">
                ${num(me.balance)}
            </div>

            <div class="muted">
                +${num(me.per_click)} за клик
            </div>

            <button
                id="clickButton"
                class="click-button">
                CLICK
            </button>

        </div>
    `;


    document
        .getElementById("clickButton")
        .onclick=click;
}


function click(){

    refreshMe();

    me.balance =
        Number(me.balance)
        +
        Number(me.per_click);

    saveAccounts();

    updateNumbers();
}


/* =========================================================
   SHOP
   ========================================================= */

function renderShop(){

    document.getElementById("shop")
    .innerHTML=`

        <div class="panel">

            <h2>
                🛒 Магазин
            </h2>

            <p class="muted">
                Покупка ПРИБАВЛЯЕТ силу
                к клику.
            </p>

        </div>


        <div class="shop">

            ${
                SHOP.map(
                    (item,index)=>`

                    <div class="card">

                        <h2>
                            ${item.name}
                        </h2>

                        <p class="muted">
                            +${num(item.power)}
                            к клику
                        </p>

                        <b
                            style="color:#67e8f9">
                            💰 ${num(item.price)}
                        </b>

                        <br><br>

                        <button
                            class="buy"
                            onclick="buy(${index})"
                            ${
                                Number(me.balance)
                                <
                                item.price
                                ?"disabled":""
                            }>
                            Купить
                        </button>

                    </div>
                `
                ).join("")
            }

        </div>


        <div class="panel">

            <h2>
                🚀 Прокачать на все деньги
            </h2>

            <p class="muted">
                Купит максимально дорогие
                доступные улучшения.
            </p>

            <button
                class="primary"
                style="max-width:360px"
                onclick="maxUpgrade()">
                ⚡ ПРОКАЧАТЬ НА ВСЕ ДЕНЬГИ
            </button>

        </div>
    `;
}


function buy(index){

    refreshMe();

    const item=SHOP[index];

    if(Number(me.balance)<item.price){

        toast("❌ Недостаточно денег");

        return;
    }

    me.balance =
        Number(me.balance)
        -
        Number(item.price);

    me.per_click =
        Number(me.per_click)
        +
        Number(item.power);

    saveAccounts();

    renderShop();

    updateNumbers();

    toast(
        "⚡ Сила клика +"
        +num(item.power)
    );
}


function maxUpgrade(){

    refreshMe();

    let count=0;

    while(true){

        const available=
            SHOP
            .filter(
                x=>
                    Number(me.balance)
                    >=
                    Number(x.price)
            )
            .sort(
                (a,b)=>
                    Number(b.price)
                    -
                    Number(a.price)
            );

        if(!available.length){
            break;
        }

        const item=available[0];

        me.balance =
            Number(me.balance)
            -
            Number(item.price);

        me.per_click =
            Number(me.per_click)
            +
            Number(item.power);

        count++;

        if(count>10000){
            break;
        }
    }

    saveAccounts();

    renderShop();

    updateNumbers();

    toast(
        count
        ?"🚀 Покупок: "+count
        :"❌ Недостаточно денег"
    );
}


/* =========================================================
   PROFILE
   ========================================================= */

function renderProfile(){

    document.getElementById("profile")
    .innerHTML=`

        <div class="panel">

            <h2>
                👤 ${esc(me.username)}
            </h2>

            <p class="muted">

                💰 Баланс:
                <b>${num(me.balance)}</b>

                <br><br>

                ⚡ За клик:
                <b>${num(me.per_click)}</b>

                <br><br>

                Статус:
                ${
                    me.is_admin
                    ?"🛡 Администратор"
                    :"⭐ Игрок"
                }

            </p>

        </div>
    `;
}


/* =========================================================
   ADMIN
   ========================================================= */

function renderAdmin(){

    document.getElementById("admin")
    .innerHTML=`

        <div class="panel">

            <h2>
                🛡 Админ-панель
            </h2>

            <p class="muted">
                Здесь находятся все аккаунты,
                созданные в этом браузере.
            </p>

            <br>

            <input
                id="playerSearch"
                placeholder="🔎 Поиск игрока...">

        </div>


        <div class="panel">

            <div
                id="players"
                class="players">
            </div>

        </div>
    `;


    loadPlayers();


    document
        .getElementById("playerSearch")
        .oninput=e=>{
            loadPlayers(
                e.target.value
            );
        };
}


function loadPlayers(search=""){

    refreshMe();

    const box=
        document.getElementById(
            "players"
        );

    if(!box)return;


    let list=
        accounts.filter(
            player=>
                player.username
                .toLowerCase()
                .includes(
                    search
                    .trim()
                    .toLowerCase()
                )
        );


    if(!list.length){

        box.innerHTML=`

            <p class="muted">
                Игроков не найдено.
            </p>

        `;

        return;
    }


    box.innerHTML=
        list.map(
            player=>`

            <div class="player">

                <div>

                    <div class="player-name">

                        ${esc(player.username)}

                        ${
                            player.username
                            .toLowerCase()
                            ===
                            ADMIN_NAME.toLowerCase()
                            ?" 👑":""
                        }

                        ${
                            player.is_admin
                            ?" 🛡":""
                        }

                    </div>

                    <div class="player-info">

                        💰 ${num(player.balance)}
                        &nbsp;|&nbsp;

                        ⚡ ${num(player.per_click)}
                        &nbsp;|&nbsp;

                        ${
                            player.is_banned
                            ?"🔴 Заблокирован"
                            :"🟢 Активен"
                        }

                    </div>

                </div>


                <button
                    class="small"
                    onclick="openPlayer('${player.id}')">
                    ⚙ Управление
                </button>

            </div>

        `
        ).join("");
}


/* =========================================================
   ADMIN PLAYER MODAL
   ========================================================= */

function openPlayer(playerId){

    const player=
        accounts.find(
            x=>x.id===playerId
        );

    if(!player)return;


    document.getElementById("modal")
    .innerHTML=`

        <div class="modal-bg">

            <div class="modal">

                <div class="modal-head">

                    <div>

                        <h2>
                            ⚙ ${esc(player.username)}
                        </h2>

                        <p class="muted">

                            ${
                                player.is_admin
                                ?"🛡 Администратор"
                                :"⭐ Игрок"
                            }

                        </p>

                    </div>

                    <button
                        class="close"
                        onclick="closeModal()">
                        ×
                    </button>

                </div>


                <div class="panel">

                    <h3>
                        💰 Баланс
                    </h3>

                    <p class="muted">
                        Сейчас:
                        ${num(player.balance)}
                    </p>

                    <input
                        id="adminBalance"
                        type="number"
                        min="0"
                        placeholder="Количество">

                    <br><br>

                    <div class="actions">

                        <button
                            class="small green"
                            onclick="addBalance('${player.id}')">
                            + Выдать
                        </button>

                        <button
                            class="small yellow"
                            onclick="setBalance('${player.id}')">
                            = Установить
                        </button>

                    </div>

                </div>


                <div class="panel">

                    <h3>
                        ⚡ Сила клика
                    </h3>

                    <p class="muted">
                        Сейчас:
                        ${num(player.per_click)}
                    </p>

                    <input
                        id="adminPower"
                        type="number"
                        min="1"
                        placeholder="Количество">

                    <br><br>

                    <div class="actions">

                        <button
                            class="small green"
                            onclick="addPower('${player.id}')">
                            + Добавить
                        </button>

                        <button
                            class="small yellow"
                            onclick="setPower('${player.id}')">
                            = Установить
                        </button>

                    </div>

                </div>


                <div class="panel">

                    <h3>
                        🛡 Управление
                    </h3>

                    <div class="actions">

                        <button
                            class="small"
                            onclick="toggleAdmin('${player.id}')">

                            ${
                                player.is_admin
                                ?"⬇ Снять админку"
                                :"⬆ Выдать админку"
                            }

                        </button>


                        <button
                            class="small ${
                                player.is_banned
                                ?"green"
                                :"red"
                            }"
                            onclick="toggleBan('${player.id}')">

                            ${
                                player.is_banned
                                ?"🔓 Разбанить"
                                :"🔒 Забанить"
                            }

                        </button>

                    </div>

                </div>

            </div>

        </div>
    `;
}


function closeModal(){

    document.getElementById(
        "modal"
    ).innerHTML="";
}


/* =========================================================
   ADMIN ACTIONS
   ========================================================= */

function canManage(target){

    return me
        &&
        me.is_admin
        &&
        target;
}


function addBalance(playerId){

    const player=
        accounts.find(
            x=>x.id===playerId
        );

    if(!canManage(player))return;

    const input=
        document.getElementById(
            "adminBalance"
        );

    const amount=
        Number(input.value);

    if(!Number.isFinite(amount)||amount<0){

        toast("Введите корректное число");

        return;
    }

    player.balance =
        Number(player.balance)
        +
        amount;

    saveAccounts();

    closeModal();

    loadPlayers();

    toast("💰 Баланс выдан");
}


function setBalance(playerId){

    const player=
        accounts.find(
            x=>x.id===playerId
        );

    if(!canManage(player))return;

    const amount=
        Number(
            document.getElementById(
                "adminBalance"
            ).value
        );

    if(!Number.isFinite(amount)||amount<0){

        toast("Введите корректное число");

        return;
    }

    player.balance=amount;

    saveAccounts();

    if(player.id===me.id){
        me=player;
    }

    closeModal();

    loadPlayers();

    updateNumbers();

    toast("💰 Баланс установлен");
}


function addPower(playerId){

    const player=
        accounts.find(
            x=>x.id===playerId
        );

    if(!canManage(player))return;

    const amount=
        Number(
            document.getElementById(
                "adminPower"
            ).value
        );

    if(!Number.isFinite(amount)||amount<0){

        toast("Введите корректное число");

        return;
    }

    player.per_click =
        Number(player.per_click)
        +
        amount;

    saveAccounts();

    closeModal();

    loadPlayers();

    toast("⚡ Сила клика увеличена");
}


function setPower(playerId){

    const player=
        accounts.find(
            x=>x.id===playerId
        );

    if(!canManage(player))return;

    const amount=
        Number(
            document.getElementById(
                "adminPower"
            ).value
        );

    if(!Number.isFinite(amount)||amount<1){

        toast("Введите число от 1");

        return;
    }

    player.per_click=amount;

    saveAccounts();

    if(player.id===me.id){
        me=player;
    }

    closeModal();

    loadPlayers();

    updateNumbers();

    toast("⚡ Сила клика установлена");
}


function toggleAdmin(playerId){

    const player=
        accounts.find(
            x=>x.id===playerId
        );

    if(!canManage(player))return;

    /*
       Killua666 остаётся главным администратором.
       Его нельзя случайно снять с админки.
    */

    if(
        player.username.toLowerCase()
        ===
        ADMIN_NAME.toLowerCase()
    ){

        toast(
            "👑 Главного администратора нельзя снять."
        );

        return;
    }

    player.is_admin=
        !player.is_admin;

    saveAccounts();

    closeModal();

    loadPlayers();

    toast(
        player.is_admin
        ?"🛡 Админ выдан"
        :"⬇ Админ снят"
    );

    /*
       Если меняем самого себя,
       перерисовываем приложение.
    */

    if(player.id===me.id){

        me=player;

        renderApp();
    }
}


function toggleBan(playerId){

    const player=
        accounts.find(
            x=>x.id===playerId
        );

    if(!canManage(player))return;

    if(
        player.username.toLowerCase()
        ===
        ADMIN_NAME.toLowerCase()
    ){

        toast(
            "👑 Главного администратора нельзя забанить."
        );

        return;
    }

    player.is_banned=
        !player.is_banned;

    saveAccounts();

    closeModal();

    loadPlayers();

    toast(
        player.is_banned
        ?"🔒 Игрок заблокирован"
        :"🔓 Игрок разблокирован"
    );
}


/* =========================================================
   UI
   ========================================================= */

function updateNumbers(){

    refreshMe();

    const balance=
        document.getElementById(
            "balance"
        );

    if(balance){

        balance.textContent=
            num(me.balance);

    }

    const gameBalance=
        document.getElementById(
            "gameBalance"
        );

    if(gameBalance){

        gameBalance.textContent=
            num(me.balance);

    }

    renderHome();
    renderProfile();
}


function openPage(page){

    currentPage=page;

    document
        .querySelectorAll(".page")
        .forEach(
            x=>x.classList.remove(
                "active"
            )
        );

    const element=
        document.getElementById(
            page
        );

    if(element){

        element.classList.add(
            "active"
        );
    }

    const titles={

        home:"Главное меню",
        game:"Игра",
        shop:"Магазин",
        profile:"Профиль",
        admin:"Админ-панель"

    };

    document.getElementById(
        "pageTitle"
    ).textContent=
        titles[page]||"Clicker";


    document
        .querySelectorAll(
            "[data-page]"
        )
        .forEach(button=>{

            button.classList.toggle(
                "active",
                button.dataset.page===page
            );

        });
}


/* =========================================================
   START
   ========================================================= */

async function start(){

    loadAccounts();

    const session=
        getSession();

    if(session){

        const player=
            accounts.find(
                x=>x.id===session
            );

        if(
            player
            &&
            !player.is_banned
        ){

            me=player;

            renderApp();

            return;
        }

        localStorage.removeItem(
            SESSION_KEY
        );
    }

    showAuth();
}

start();

</script>
