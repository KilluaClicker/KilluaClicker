<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KilluaClicker</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow-x: hidden;

    font-family:
        Arial,
        sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(0, 234, 255, 0.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(132, 67, 255, 0.22),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #050712,
            #080c1b 50%,
            #050713
        );
}


/* =========================
   ФОНОВЫЕ СВЕЧЕНИЯ
========================= */

.bg {
    position: fixed;

    width: 320px;
    height: 320px;

    border-radius: 50%;

    filter: blur(90px);

    opacity: 0.25;

    pointer-events: none;
}

.bg.one {
    top: -120px;
    left: -100px;

    background: #00eaff;
}

.bg.two {
    right: -100px;
    bottom: -130px;

    background: #773cff;
}


/* =========================
   ОСНОВНОЙ КОНТЕЙНЕР
========================= */

.menu {
    position: relative;

    width: min(470px, 92%);

    padding: 32px;

    border:
        1px solid
        rgba(255, 255, 255, 0.08);

    border-radius: 30px;

    background:
        linear-gradient(
            145deg,
            rgba(19, 26, 45, 0.88),
            rgba(7, 11, 22, 0.94)
        );

    box-shadow:
        0 30px 100px
        rgba(0, 0, 0, 0.5);

    backdrop-filter: blur(25px);

    z-index: 2;
}


/* =========================
   ЛОГО
========================= */

.logo {
    text-align: center;

    margin-bottom: 5px;

    font-size: 48px;

    font-weight: 900;

    letter-spacing: -2px;

    color: #00eaff;

    text-shadow:
        0 0 15px
        rgba(0, 234, 255, 0.5),

        0 0 45px
        rgba(0, 234, 255, 0.18);
}


.game-name {
    text-align: center;

    color: #77839b;

    font-size: 12px;

    letter-spacing: 4px;

    font-weight: bold;

    margin-bottom: 25px;
}


/* =========================
   ПРОФИЛЬ
========================= */

.user-card {
    display: flex;

    align-items: center;

    gap: 13px;

    padding: 13px;

    margin-bottom: 20px;

    border-radius: 17px;

    background:
        rgba(255, 255, 255, 0.035);

    border:
        1px solid
        rgba(255, 255, 255, 0.06);
}


.avatar {
    width: 45px;
    height: 45px;

    display: flex;

    justify-content: center;
    align-items: center;

    flex-shrink: 0;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #00eaff,
            #5965ff
        );

    color: #06101b;

    font-weight: 900;

    font-size: 18px;
}


.user-name {
    font-size: 15px;

    font-weight: 800;
}


.user-status {
    margin-top: 4px;

    color: #7c879d;

    font-size: 11px;
}


/* =========================
   КНОПКИ
========================= */

.buttons {
    display: flex;

    flex-direction: column;

    gap: 10px;
}


button {
    width: 100%;

    min-height: 54px;

    border: 0;

    border-radius: 16px;

    cursor: pointer;

    color: white;

    background:
        rgba(255, 255, 255, 0.045);

    border:
        1px solid
        rgba(255, 255, 255, 0.06);

    font-size: 14px;

    font-weight: 800;

    transition:
        transform 0.18s ease,
        background 0.18s ease,
        box-shadow 0.18s ease;
}


button:hover {
    transform:
        translateY(-2px);

    background:
        rgba(255, 255, 255, 0.08);

    box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.2);
}


button:active {
    transform:
        translateY(1px)
        scale(0.99);
}


/* =========================
   ИГРАТЬ
========================= */

.play {
    min-height: 62px;
background:
        linear-gradient(
            135deg,
            #ffe600,
            #ff7a00
        );

    color: #111;

    font-size: 17px;

    box-shadow:
        0 10px 35px
        rgba(255, 166, 0, 0.18);
}


.play:hover {
    background:
        linear-gradient(
            135deg,
            #fff000,
            #ff8b00
        );

    box-shadow:
        0 15px 45px
        rgba(255, 166, 0, 0.27);
}


/* =========================
   АДМИН
========================= */

.admin {
    background:
        linear-gradient(
            135deg,
            #00eaff,
            #5965ff
        );

    color: #06101b;

    border: none;
}


.admin:hover {
    background:
        linear-gradient(
            135deg,
            #38efff,
            #7180ff
        );
}


/* =========================
   РАЗДЕЛИТЕЛЬ
========================= */

.divider {
    height: 1px;

    margin: 7px 0;

    background:
        rgba(255, 255, 255, 0.06);
}


/* =========================
   ВЫХОД
========================= */

.logout {
    color: #ff6f8e;

    background:
        rgba(255, 70, 105, 0.05);

    border-color:
        rgba(255, 70, 105, 0.1);
}


/* =========================
   НИЗ
========================= */

.footer {
    text-align: center;

    margin-top: 22px;

    color: #4f5a70;

    font-size: 10px;

    letter-spacing: 1px;
}


/* =========================
   TOAST
========================= */

.toast {
    position: fixed;

    left: 50%;
    bottom: 25px;

    z-index: 100;

    padding: 13px 18px;

    border-radius: 13px;

    background:
        rgba(18, 24, 39, 0.96);

    border:
        1px solid
        rgba(255, 255, 255, 0.1);

    box-shadow:
        0 15px 40px
        rgba(0, 0, 0, 0.4);

    font-size: 13px;

    font-weight: bold;

    opacity: 0;

    pointer-events: none;

    transform:
        translate(-50%, 20px);

    transition: 0.25s;
}


.toast.show {
    opacity: 1;

    transform:
        translate(-50%, 0);
}


/* =========================
   ТЕЛЕФОН
========================= */

@media (max-width: 500px) {

    .menu {
        padding: 23px;

        border-radius: 24px;
    }

    .logo {
        font-size: 40px;
    }

}

</style>
</head>


<body>


<div class="bg one"></div>
<div class="bg two"></div>


<div class="menu">


    <!-- ЛОГО -->

    <div class="logo">
        Killua
    </div>

    <div class="game-name">
        KILLUACLICKER
    </div>


    <!-- ПОЛЬЗОВАТЕЛЬ -->

    <div
        id="userCard"
        class="user-card"
    >

        <div
            id="avatar"
            class="avatar"
        >
            ?
        </div>

        <div>

            <div
                id="userName"
                class="user-name"
            >
                Гость
            </div>

            <div
                id="userStatus"
                class="user-status"
            >
                Войдите в аккаунт
            </div>

        </div>

    </div>


    <!-- КНОПКИ -->

    <div class="buttons">


        <button
            class="play"
            onclick="go('game.html')"
        >
            ⚡ ИГРАТЬ
        </button>


        <button
            onclick="go('shop.html')"
        >
            🛒 МАГАЗИН
        </button>


        <button
            onclick="go('autoclicker.html')"
        >
            🤖 АВТОКЛИКЕР
        </button>


        <button
            onclick="go('tops.html')"
        >
            🏆 ТОПЫ
        </button>


        <button
            onclick="go('profile.html')"
        >
            👤 ПРОФИЛЬ
        </button>


        <button
            onclick="go('settings.html')"
        >
            ⚙️ НАСТРОЙКИ
        </button>


        <!-- АДМИНКА ПОЯВИТСЯ ТОЛЬКО АДМИНУ -->

        <div
            id="adminContainer"
        ></div>


        <div class="divider"></div>


        <button
            id="loginButton"
            onclick="go('login.html')"
        >
            🔐 ВОЙТИ
        </button>
<button
            id="registerButton"
            onclick="go('register.html')"
        >
            📝 РЕГИСТРАЦИЯ
        </button>


        <button
            id="logoutButton"
            class="logout"
            onclick="logout()"
            style="display:none;"
        >
            🚪 ВЫЙТИ
        </button>


    </div>


    <div class="footer">
        KILLUACLICKER • v1.0
    </div>


</div>


<div
    id="toast"
    class="toast"
></div>


<script>


/* =====================================
   НАСТРОЙКИ
===================================== */


const MAIN_ADMIN =
    "Killua666";


/* =====================================
   ТЕКУЩИЙ ПОЛЬЗОВАТЕЛЬ
===================================== */


const currentUser =
    localStorage.getItem(
        "currentUser"
    );


/* =====================================
   ПЕРЕХОД
===================================== */


function go(page) {

    window.location.href =
        page;

}


/* =====================================
   ПОЛУЧЕНИЕ USERS
===================================== */


function getUsers() {

    try {

        const users =
            JSON.parse(
                localStorage.getItem(
                    "users"
                ) || "[]"
            );


        if (
            !Array.isArray(users)
        ) {

            return [];

        }


        return users;

    }
    catch {

        return [];

    }

}


/* =====================================
   ПРОВЕРКА АДМИНА
===================================== */


function isAdmin() {


    /* Killua666 — главный админ */

    if (
        currentUser === MAIN_ADMIN
    ) {

        return true;

    }


    const users =
        getUsers();


    const user =
        users.find(
            function (u) {

                return (
                    u.nick ===
                    currentUser
                );

            }
        );


    return !!(
        user &&
        user.admin === true
    );

}


/* =====================================
   ЭКРАН ПОЛЬЗОВАТЕЛЯ
===================================== */


const userName =
    document.getElementById(
        "userName"
    );


const userStatus =
    document.getElementById(
        "userStatus"
    );


const avatar =
    document.getElementById(
        "avatar"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const registerButton =
    document.getElementById(
        "registerButton"
    );


const logoutButton =
    document.getElementById(
        "logoutButton"
    );


/* =====================================
   ЕСЛИ ВОШЁЛ
===================================== */


if (
    currentUser
) {

    userName.textContent =
        currentUser;


    avatar.textContent =
        currentUser
            .charAt(0)
            .toUpperCase();


    if (
        isAdmin()
    ) {

        userStatus.textContent =
            "👑 Администратор";

    }
    else {

        userStatus.textContent =
            "⚡ Игрок KilluaClicker";

    }


    loginButton.style.display =
        "none";


    registerButton.style.display =
        "none";


    logoutButton.style.display =
        "block";

}


/* =====================================
   ЕСЛИ НЕ ВОШЁЛ
===================================== */


else {

    userName.textContent =
        "Гость";


    userStatus.textContent =
        "Войдите в аккаунт";


    avatar.textContent =
        "?";

}


/* =====================================
   АДМИН-ПАНЕЛЬ
===================================== */


const adminContainer =
    document.getElementById(
        "adminContainer"
    );


if (
    currentUser &&
    isAdmin()
) {

    adminContainer.innerHTML = 

        <button
            class="admin"
            onclick="go('admin.html')"
        >
            👑 АДМИН-ПАНЕЛЬ
        </button>

    ;

}


/* =====================================
   ВЫХОД
===================================== */


function logout() {

    localStorage.removeItem(
        "currentUser"
    );


    showToast(
        "🚪 Вы вышли из аккаунта"
    );
setTimeout(
        function () {

            location.reload();

        },
        700
    );

}


/* =====================================
   TOAST
===================================== */


let toastTimer;


function showToast(
    message
) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function () {

                toast.classList.remove(
                    "show"
                );

            },
            1800
        );

}

</script>


</body>
</html>
