<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KilluaClicker</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
min-height:100vh;
font-family:Arial,sans-serif;
color:white;
background:
radial-gradient(circle at 20% 20%,#123d63,transparent 35%),
radial-gradient(circle at 80% 80%,#45135c,transparent 35%),
#060814;
display:flex;
align-items:center;
justify-content:center;
}
.box{
width:min(430px,92%);
padding:30px;
text-align:center;
}
h1{
font-size:55px;
margin:0;
color:#00eaff;
text-shadow:0 0 30px #00eaff55;
}
.sub{color:#7f8ba5;margin-bottom:30px}
button{
width:100%;
padding:16px;
margin:6px 0;
border:0;
border-radius:15px;
background:#12192c;
color:white;
font-weight:bold;
cursor:pointer;
transition:.2s;
}
button:hover{transform:translateY(-2px);background:#1c2945}
.play{
background:linear-gradient(135deg,#ffe600,#ff7800);
color:#111;
}
.admin{
background:linear-gradient(135deg,#00eaff,#5965ff);
}
</style>
</head>

<body>

<div class="box">

<h1>Killua</h1>

<div class="sub">⚡ KILLUACLICKER</div>

<button class="play" onclick="location.href='game.html'">
⚡ ИГРАТЬ
</button>

<button onclick="location.href='shop.html'">
🛒 МАГАЗИН
</button>

<button onclick="location.href='autoclicker.html'">
🤖 АВТОКЛИКЕР
</button>

<button onclick="location.href='tops.html'">
🏆 ТОПЫ
</button>

<button onclick="location.href='profile.html'">
👤 ПРОФИЛЬ
</button>

<button onclick="location.href='settings.html'">
⚙️ НАСТРОЙКИ
</button>

<button class="admin" onclick="location.href='admin.html'">
👑 АДМИН-ПАНЕЛЬ
</button>

</div>

<script>
const current=localStorage.getItem("currentUser");

if(!current){
    // Можно играть только после регистрации
    // Убери эти две строки, если хочешь разрешить игру без аккаунта.
}
</script>

</body>
</html>
