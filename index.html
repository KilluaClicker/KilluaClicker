<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KilluaClicker</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:white;
    background:
        radial-gradient(circle at 20% 10%,#00eaff35,transparent 30%),
        radial-gradient(circle at 80% 90%,#714cff35,transparent 30%),
        #050810;
    display:flex;
    align-items:center;
    justify-content:center;
}

.container{
    width:min(450px,92%);
    padding:30px;
    border-radius:30px;
    background:rgba(15,22,38,.94);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 30px 100px rgba(0,0,0,.6);
}

.logo{
    text-align:center;
    font-size:48px;
    font-weight:900;
    color:#00eaff;
    text-shadow:0 0 30px #00eaff55;
}

.subtitle{
    text-align:center;
    color:#66738c;
    font-size:11px;
    letter-spacing:5px;
    margin:5px 0 25px;
}

.user{
    display:flex;
    align-items:center;
    gap:13px;
    padding:13px;
    margin-bottom:18px;
    border-radius:18px;
    background:#ffffff08;
}

.avatar{
    width:48px;
    height:48px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#00eaff,#536bff);
    color:#06101b;
    font-size:20px;
    font-weight:900;
}

.username{
    font-weight:bold;
}

.status{
    color:#758198;
    font-size:12px;
    margin-top:4px;
}

button{
    width:100%;
    border:0;
    padding:16px;
    margin:5px 0;
    border-radius:15px;
    color:white;
    background:#ffffff09;
    border:1px solid #ffffff0c;
    font-weight:800;
    cursor:pointer;
    transition:.18s;
}

button:hover{
    transform:translateY(-2px);
    background:#ffffff14;
}

.play{
    background:linear-gradient(135deg,#ffe600,#ff7900);
    color:#111;
    font-size:17px;
}

.admin{
    background:linear-gradient(135deg,#00eaff,#5965ff);
    color:#06101b;
}

.logout{
    color:#ff6d8c;
}

.footer{
    text-align:center;
    color:#414c62;
    font-size:10px;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">Killua</div>

    <div class="subtitle">
        KILLUACLICKER
    </div>

    <div class="user">

        <div class="avatar" id="avatar">?</div>

        <div>
            <div class="username" id="username">
                Гость
            </div>

            <div class="status" id="status">
                Войдите или зарегистрируйтесь
            </div>
        </div>

    </div>

    <button class="play" onclick="openPage('game.html')">
        ⚡ ИГРАТЬ
    </button>

    <button onclick="openPage('shop.html')">
        🛒 МАГАЗИН
    </button>

    <button onclick="openPage('autoclicker.html')">
        🤖 АВТОКЛИКЕР
    </button>

    <button onclick="openPage('tops.html')">
        🏆 ТОПЫ
    </button>

    <button onclick="openPage('profile.html')">
        👤 ПРОФИЛЬ
    </button>

    <button onclick="openPage('settings.html')">
        ⚙️ НАСТРОЙКИ
    </button>

    <div id="adminBlock"></div>

    <div id="authButtons">

        <button onclick="openPage('login.html')">
            🔐 ВОЙТИ
        </button>

        <button onclick="openPage('register.html')">
            📝 РЕГИСТРАЦИЯ
        </button>

    </div>

    <button
        id="logoutButton"
        class="logout"
        style="display:none"
        onclick="logout()"
    >
        🚪 ВЫЙТИ
    </button>

    <div class="footer">
        KILLUACLICKER • v1.0
    </div>

</div>

<script>

const MAIN_ADMIN = "Killua666";

function openPage(page){
    window.location.href = page;
}

function getUsers(){

    try{

        const data =
            JSON.parse(
                localStorage.getItem("users") || "[]"
            );

        return Array.isArray(data) ? data : [];

    }catch(error){

        return [];

    }

}

function getCurrentUser(){

    const nick =
        localStorage.getItem("currentUser");
if(!nick){
        return null;
    }

    return getUsers().find(
        user => user.nick === nick
    ) || null;

}

function isAdmin(){

    const nick =
        localStorage.getItem("currentUser");

    if(!nick){
        return false;
    }

    if(nick === MAIN_ADMIN){
        return true;
    }

    const user = getCurrentUser();

    return user && user.admin === true;

}

function logout(){

    localStorage.removeItem("currentUser");

    window.location.reload();

}

function updateMenu(){

    const nick =
        localStorage.getItem("currentUser");

    const user =
        getCurrentUser();

    if(!nick || !user){

        document.getElementById("username")
            .textContent = "Гость";

        document.getElementById("status")
            .textContent = "Войдите или зарегистрируйтесь";

        document.getElementById("avatar")
            .textContent = "?";

        return;

    }

    document.getElementById("username")
        .textContent = user.nick;

    document.getElementById("avatar")
        .textContent =
        user.nick.charAt(0).toUpperCase();

    document.getElementById("status")
        .textContent =
        isAdmin()
        ? "👑 Администратор"
        : "⚡ Игрок";

    document.getElementById("authButtons")
        .style.display = "none";

    document.getElementById("logoutButton")
        .style.display = "block";

    if(isAdmin()){

        document.getElementById("adminBlock")
            .innerHTML = 
                <button
                    class="admin"
                    onclick="openPage('admin.html')"
                >
                    👑 АДМИН-ПАНЕЛЬ
                </button>
            ;

    }

}

updateMenu();

</script>

</body>
</html>
