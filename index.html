<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KilluaClicker — Админ-панель</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, sans-serif;

    color: #ffffff;

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(0, 234, 255, 0.16),
            transparent 32%
        ),
        radial-gradient(
            circle at 100% 100%,
            rgba(120, 60, 255, 0.18),
            transparent 35%
        ),
        #060810;
}


/* =========================
   ОСНОВНОЙ КОНТЕЙНЕР
========================= */

.container {
    width: min(1200px, 94%);
    margin: auto;
    padding: 25px 0 60px;
}


/* =========================
   ВЕРХ
========================= */

.header {
    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 20px;

    margin-bottom: 25px;
}


.brand {
    display: flex;

    align-items: center;

    gap: 14px;
}


.logo {
    width: 55px;
    height: 55px;

    display: flex;

    justify-content: center;
    align-items: center;

    border-radius: 17px;

    background:
        linear-gradient(
            135deg,
            #00eaff,
            #5965ff
        );

    color: #06101b;

    font-size: 25px;

    box-shadow:
        0 0 30px
        rgba(0, 234, 255, 0.25);
}


.title {
    margin: 0;

    font-size: 23px;
}


.subtitle {
    margin: 5px 0 0;

    color: #7d879c;

    font-size: 13px;
}


.badge {
    display: inline-block;

    margin-top: 8px;

    padding: 6px 10px;

    border-radius: 999px;

    background:
        rgba(0, 234, 255, 0.08);

    border:
        1px solid
        rgba(0, 234, 255, 0.2);

    color: #00eaff;

    font-size: 11px;

    font-weight: bold;
}


.back {
    padding: 12px 17px;

    border:
        1px solid
        rgba(255,255,255,0.08);

    border-radius: 13px;

    background:
        rgba(255,255,255,0.04);

    color: white;

    cursor: pointer;

    font-weight: bold;

    transition: 0.2s;
}


.back:hover {
    transform: translateY(-2px);

    background:
        rgba(255,255,255,0.09);
}


/* =========================
   СТАТИСТИКА
========================= */

.stats {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 15px;

    margin-bottom: 25px;
}


.stat {
    padding: 20px;

    border:
        1px solid
        rgba(255,255,255,0.07);

    border-radius: 20px;

    background:
        rgba(255,255,255,0.035);

    backdrop-filter: blur(15px);
}


.stat-label {
    color: #78839a;

    font-size: 11px;

    font-weight: bold;

    margin-bottom: 9px;
}


.stat-value {
    font-size: 29px;

    font-weight: 900;
}


.blue {
    color: #00eaff;
}


.yellow {
    color: #ffe600;
}


.purple {
    color: #b77cff;
}


/* =========================
   ПОИСК
========================= */

.search {
    margin-bottom: 18px;
}


.search input {
    width: 100%;

    padding: 15px 18px;

    border:
        1px solid
        rgba(255,255,255,0.07);

    border-radius: 15px;

    outline: none;

    background:
        rgba(255,255,255,0.035);

    color: white;

    font-size: 14px;
}


.search input:focus {
    border-color:
        rgba(0,234,255,0.4);

    box-shadow:
        0 0 0 3px
        rgba(0,234,255,0.05);
}


/* =========================
   ИГРОКИ
========================= */

.players {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 16px;
}


.player {
    padding: 20px;

    border:
        1px solid
        rgba(255,255,255,0.07);

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            rgba(20,27,45,0.95),
            rgba(9,13,24,0.95)
        );

    box-shadow:
        0 15px 45px
        rgba(0,0,0,0.2);

    transition: 0.2s;
}


.player:hover {
    transform:
        translateY(-3px);

    border-color:
        rgba(0,234,255,0.2);
}
/* =========================
   ИНФОРМАЦИЯ
========================= */

.player-top {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 18px;
}


.player-info {
    display: flex;

    align-items: center;

    gap: 13px;
}


.avatar {
    width: 50px;
    height: 50px;

    display: flex;

    justify-content: center;
    align-items: center;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            #182640,
            #0e1422
        );

    border:
        1px solid
        rgba(255,255,255,0.08);

    color: #00eaff;

    font-size: 19px;

    font-weight: 900;
}


.nick {
    font-size: 17px;

    font-weight: 900;
}


.role {
    margin-top: 5px;

    color: #778299;

    font-size: 11px;
}


.role.admin {
    color: #00eaff;

    font-weight: bold;
}


.crown {
    font-size: 21px;

    color: #ffe600;
}


/* =========================
   ПОЛЯ
========================= */

.fields {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 9px;

    margin-bottom: 12px;
}


.field label {
    display: block;

    margin-bottom: 6px;

    color: #778299;

    font-size: 10px;

    font-weight: bold;
}


.field input {
    width: 100%;

    padding: 11px 10px;

    border:
        1px solid
        rgba(255,255,255,0.06);

    border-radius: 11px;

    outline: none;

    background: #080c16;

    color: white;

    font-size: 13px;
}


.field input:focus {
    border-color:
        rgba(0,234,255,0.4);
}


/* =========================
   КНОПКИ
========================= */

.actions {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 9px;
}


.action {
    padding: 12px;

    border: 0;

    border-radius: 12px;

    background:
        rgba(255,255,255,0.055);

    color: white;

    cursor: pointer;

    font-weight: bold;

    transition: 0.2s;
}


.action:hover {
    transform:
        translateY(-1px);

    background:
        rgba(255,255,255,0.1);
}


.save {
    background:
        linear-gradient(
            135deg,
            #00eaff,
            #4169ff
        );

    color: #06101b;
}


.save:hover {
    background:
        linear-gradient(
            135deg,
            #35eeff,
            #5d78ff
        );
}


.give {
    color: #00eaff;

    background:
        rgba(0,234,255,0.08);

    border:
        1px solid
        rgba(0,234,255,0.16);
}


.remove {
    color: #ff7190;

    background:
        rgba(255,60,100,0.08);

    border:
        1px solid
        rgba(255,60,100,0.16);
}


.disabled {
    opacity: 0.45;

    cursor:
        not-allowed;
}


/* =========================
   ЕСЛИ НЕТ ИГРОКОВ
========================= */

.empty {
    grid-column:
        1 / -1;

    padding: 60px 20px;

    text-align: center;

    border:
        1px dashed
        rgba(255,255,255,0.1);

    border-radius: 22px;

    color: #778299;
}


.empty-icon {
    font-size: 45px;

    margin-bottom: 12px;
}


/* =========================
   УВЕДОМЛЕНИЕ
========================= */

.toast {
    position: fixed;

    left: 50%;
    bottom: 25px;

    transform:
        translate(-50%, 30px);

    opacity: 0;

    pointer-events: none;

    padding: 14px 20px;

    border-radius: 14px;

    background:
        rgba(18,24,39,0.97);

    border:
        1px solid
        rgba(255,255,255,0.1);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,0.4);

    font-size: 13px;

    font-weight: bold;

    transition: 0.25s;

    z-index: 100;
}


.toast.show {
    opacity: 1;

    transform:
        translate(-50%, 0);
}


/* =========================
   МОБИЛЬНАЯ ВЕРСИЯ
========================= */

@media (max-width: 800px) {

    .stats {
        grid-template-columns: 1fr;
    }


    .players {
        grid-template-columns: 1fr;
    }

}


@media (max-width: 500px) {

    .header {
        align-items: flex-start;
    }


    .fields {
        grid-template-columns: 1fr;
    }


    .actions {
        grid-template-columns: 1fr;
    }
.title {
        font-size: 19px;
    }


    .back {
        padding: 10px 12px;

        font-size: 12px;
    }

}

</style>
</head>


<body>


<div class="container">


    <!-- HEADER -->

    <header class="header">

        <div class="brand">

            <div class="logo">
                👑
            </div>

            <div>

                <h1 class="title">
                    KilluaClicker
                </h1>

                <p class="subtitle">
                    Центр управления игроками
                </p>

                <span class="badge">
                    🛡️ ADMIN PANEL
                </span>

            </div>

        </div>


        <button
            class="back"
            onclick="location.href='index.html'"
        >
            ← Меню
        </button>

    </header>



    <!-- СТАТИСТИКА -->

    <section class="stats">


        <div class="stat">

            <div class="stat-label">
                👥 ВСЕГО ИГРОКОВ
            </div>

            <div
                id="totalPlayers"
                class="stat-value blue"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                🪙 ВСЕГО МОНЕТ
            </div>

            <div
                id="totalCoins"
                class="stat-value yellow"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                👑 АДМИНИСТРАТОРОВ
            </div>

            <div
                id="totalAdmins"
                class="stat-value purple"
            >
                0
            </div>

        </div>


    </section>



    <!-- ПОИСК -->

    <div class="search">

        <input
            id="search"
            type="text"
            placeholder="🔎  Найти игрока по нику..."
            autocomplete="off"
        >

    </div>



    <!-- ИГРОКИ -->

    <section
        id="players"
        class="players"
    ></section>


</div>



<!-- TOAST -->

<div
    id="toast"
    class="toast"
></div>



<script>


/* =========================================
   ГЛАВНЫЙ АДМИНИСТРАТОР
========================================= */


const MAIN_ADMIN =
    "Killua666";


/* =========================================
   ТЕКУЩИЙ АККАУНТ
========================================= */


const currentUser =
    localStorage.getItem("currentUser");


/* =========================================
   ПОЛУЧИТЬ ПОЛЬЗОВАТЕЛЕЙ
========================================= */


function getUsers() {

    try {

        const users =
            JSON.parse(
                localStorage.getItem("users") || "[]"
            );


        if (!Array.isArray(users)) {

            return [];

        }


        return users;

    }

    catch (error) {

        return [];

    }

}


/* =========================================
   СОХРАНИТЬ ПОЛЬЗОВАТЕЛЕЙ
========================================= */


function saveUsers(users) {

    localStorage.setItem(
        "users",
        JSON.stringify(users)
    );

}


/* =========================================
   ПРОВЕРКА АДМИНА
========================================= */


function isAdmin() {


    /*
       Killua666 всегда главный администратор.
    */

    if (
        currentUser === MAIN_ADMIN
    ) {

        return true;

    }


    const users =
        getUsers();


    const user =
        users.find(
            u =>
                u.nick === currentUser
        );


    return !!(
        user &&
        user.admin === true
    );

}


/* =========================================
   ЗАЩИТА СТРАНИЦЫ
========================================= */


if (
    !currentUser ||
    !isAdmin()
) {

    document.body.innerHTML = `
<div style="
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            color:white;
            background:#060810;
            font-family:Arial;
            padding:25px;
        ">

            <div>

                <div style="
                    font-size:65px;
                    margin-bottom:15px;
                ">
                    🔒
                </div>

                <h1>
                    Доступ запрещён
                </h1>

                <p style="
                    color:#7d879c;
                ">
                    У этого аккаунта нет
                    прав администратора.
                </p>

                <button
                    onclick="location.href='index.html'"
                    style="
                        margin-top:15px;
                        padding:14px 22px;
                        border:0;
                        border-radius:13px;
                        background:#00eaff;
                        color:#06101b;
                        font-weight:bold;
                        cursor:pointer;
                    "
                >
                    Вернуться в меню
                </button>

            </div>

        </div>

    `;


    throw new Error(
        "Admin access denied"
    );

}


/* =========================================
   УВЕДОМЛЕНИЯ
========================================= */


let toastTimer;


function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function () {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================================
   ФОРМАТ ЧИСЕЛ
========================================= */


function formatNumber(number) {

    return Number(
        number || 0
    ).toLocaleString(
        "ru-RU"
    );

}


/* =========================================
   ЗАЩИТА HTML
========================================= */


function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(
            text ?? ""
        );


    return div.innerHTML;

}


/* =========================================
   ОТРИСОВКА
========================================= */


function render() {


    const users =
        getUsers();


    const container =
        document.getElementById(
            "players"
        );


    const search =
        document
            .getElementById(
                "search"
            )
            .value
            .trim()
            .toLowerCase();


    /* =========================
       СТАТИСТИКА
    ========================= */


    document.getElementById(
        "totalPlayers"
    ).textContent =
        users.length;


    const totalCoins =
        users.reduce(
            function (
                sum,
                user
            ) {

                return (
                    sum +
                    Number(
                        user.coins || 0
                    )
                );

            },
            0
        );


    document.getElementById(
        "totalCoins"
    ).textContent =
        formatNumber(
            totalCoins
        );


    const totalAdmins =
        users.filter(
            function (user) {

                return (
                    user.nick === MAIN_ADMIN ||
                    user.admin === true
                );

            }
        ).length;


    document.getElementById(
        "totalAdmins"
    ).textContent =
        totalAdmins;


    /* =========================
       ФИЛЬТР
    ========================= */


    const filtered =
        users.filter(
            function (user) {
return String(
                    user.nick || ""
                )
                .toLowerCase()
                .includes(
                    search
                );

            }
        );


    /* =========================
       НЕТ ИГРОКОВ
    ========================= */


    if (
        filtered.length === 0
    ) {

        container.innerHTML = 

            <div class="empty">

                <div class="empty-icon">
                    🔎
                </div>

                Игрок не найден

            </div>

        ;

        return;

    }


    container.innerHTML = "";


    /* =========================
       КАРТОЧКИ
    ========================= */


    filtered.forEach(
        function (
            user
        ) {


            const index =
                users.indexOf(
                    user
                );


            const isMainAdmin =
                user.nick === MAIN_ADMIN;


            const initial =
                String(
                    user.nick || "?"
                )
                .charAt(0)
                .toUpperCase();


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "player";


            card.innerHTML = 

                <div class="player-top">


                    <div class="player-info">


                        <div class="avatar">
                            ${escapeHTML(initial)}
                        </div>


                        <div>

                            <div class="nick">
                                ${escapeHTML(user.nick)}
                            </div>


                            <div class="
                                role
                                ${
                                    isMainAdmin ||
                                    user.admin
                                    ? "admin"
                                    : ""
                                }
                            ">

                                ${
                                    isMainAdmin
                                    ? "👑 Главный администратор"
                                    : user.admin
                                    ? "🛡️ Администратор"
                                    : "👤 Обычный игрок"
                                }

                            </div>

                        </div>


                    </div>


                    ${
                        isMainAdmin
                        ? 
                            <div class="crown">
                                👑
                            </div>
                        `
                        : ""
                    }


                </div>


                <div class="fields">


                    <div class="field">

                        <label>
                            🪙 БАЛАНС
                        </label>

                        <input
                            id="coins-${index}"
                            type="number"
                            min="0"
                            value="${Number(
                                user.coins || 0
                            )}"
                        >

                    </div>


                    <div class="field">

                        <label>
                            ⚡ СИЛА КЛИКА
                        </label>

                        <input
                            id="power-${index}"
                            type="number"
                            min="1"
                            value="${Number(
                                user.power || 1
                            )}"
                        >

                    </div>


                    <div class="field">

                        <label>
                            🤖 АВТОКЛИКЕР
                        </label>
<input
                            id="auto-${index}"
                            type="number"
                            min="0"
                            value="${Number(
                                user.auto || 0
                            )}"
                        >

                    </div>


                </div>


                <div class="actions">


                    <button
                        class="action save"
                        onclick="
                            savePlayer(${index})
                        "
                    >
                        💾 СОХРАНИТЬ
                    </button>


                    ${
                        !isMainAdmin
                        ?

                        

                        <button
                            class="
                                action
                                ${
                                    user.admin
                                    ? "remove"
                                    : "give"
                                }
                            "
                            onclick="
                                toggleAdmin(${index})
                            "
                        >

                            ${
                                user.admin
                                ? "🚫 СНЯТЬ АДМИНКУ"
                                : "👑 ВЫДАТЬ АДМИНКУ"
                            }

                        </button>

                        

                        :

                        

                        <button
                            class="
                                action
                                disabled
                            "
                            disabled
                        >
                            👑 ГЛАВНЫЙ АДМИН
                        </button>

                        

                    }


                </div>

            ;


            container.appendChild(
                card
            );


        }
    );

}


/* =========================================
   СОХРАНИТЬ ИГРОКА
========================================= */


function savePlayer(index) {


    const users =
        getUsers();


    const user =
        users[index];


    if (!user) {

        showToast(
            "❌ Игрок не найден"
        );

        return;

    }


    const coinsInput =
        document.getElementById(
            coins-${index}
        );


    const powerInput =
        document.getElementById(
            power-${index}
        );


    const autoInput =
        document.getElementById(
            auto-${index}
        );


    const coins =
        Number(
            coinsInput.value
        );


    const power =
        Number(
            powerInput.value
        );


    const auto =
        Number(
            autoInput.value
        );


    /* =========================
       ПРОВЕРКА
    ========================= */


    if (
        !Number.isFinite(coins) ||
        !Number.isFinite(power) ||
        !Number.isFinite(auto)
    ) {

        showToast(
            "❌ Неверные значения"
        );

        return;

    }


    if (
        coins < 0 ||
        power < 1 ||
        auto < 0
    ) {

        showToast(
            "❌ Значения не могут быть отрицательными"
        );

        return;

    }


    /* =========================
       СОХРАНЕНИЕ
    ========================= */


    user.coins =
        Math.floor(
            coins
        );


    user.power =
        Math.floor(
            power
        );


    user.auto =
        Math.floor(
            auto
        );


    saveUsers(
        users
    );


    showToast(
        ✅ ${user.nick} сохранён`
    );


    render();

}


/* =========================================
   ВЫДАТЬ / СНЯТЬ АДМИНКУ
========================================= */


function toggleAdmin(index) {


    const users =
        getUsers();


    const user =
        users[index];
if (!user) {

        return;

    }


    /* Главного админа менять нельзя */

    if (
        user.nick === MAIN_ADMIN
    ) {

        showToast(
            "👑 Главного администратора нельзя изменить"
        );

        return;

    }


    user.admin =
        !Boolean(
            user.admin
        );


    saveUsers(
        users
    );


    if (
        user.admin
    ) {

        showToast(
            👑 ${user.nick} получил админку
        );

    }
    else {

        showToast(
            🚫 Админка ${user.nick} снята
        );

    }


    render();

}


/* =========================================
   ПОИСК
========================================= */


document
    .getElementById(
        "search"
    )
    .addEventListener(
        "input",
        render
    );
