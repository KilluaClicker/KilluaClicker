<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Game</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #263b80 0%, #11162f 45%, #080b18 100%);
            color: white;
            min-height: 100vh;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        /* AUTH */

        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-box {
            width: 100%;
            max-width: 420px;
            background: rgba(20, 25, 55, 0.95);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.45);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #9da8d0;
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: #20284d;
            color: #aab4da;
            font-size: 16px;
        }

        .tab.active {
            background: #5865f2;
            color: white;
        }

        .input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 1px solid #343d68;
            background: #11162d;
            color: white;
            outline: none;
            font-size: 16px;
        }

        .input:focus {
            border-color: #6673ff;
        }

        .auth-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #5865f2, #8b5cf6);
            color: white;
            font-size: 17px;
            font-weight: bold;
            margin-top: 5px;
        }

        .auth-button:hover {
            filter: brightness(1.15);
        }

        .message {
            margin-top: 15px;
            text-align: center;
            color: #ff8080;
            min-height: 20px;
        }

        /* GAME */

        .game {
            min-height: 100vh;
        }

        header {
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            background: rgba(10, 14, 32, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .header-logo {
            font-size: 25px;
            font-weight: 900;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .username {
            color: #aeb8df;
        }

        .logout {
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            background: #252d50;
            color: white;
        }

        .logout:hover {
            background: #343e6d;
        }

        .game-content {
            max-width: 1200px;
            margin: auto;
            padding: 45px 25px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
        }

        .clicker-panel,
        .shop-panel {
            background: rgba(17, 23, 49, 0.88);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        }

        .balance-title {
            text-align: center;
            color: #9ba7d0;
            font-size: 17px;
            margin-bottom: 10px;
        }

        .balance {
            text-align: center;
            font-size: 48px;
            font-weight: 900;
            color: #ffd84d;
            word-break: break-word;
            margin-bottom: 5px;
        }

        .per-click {
            text-align: center;
            color: #7ee7a4;
            margin-bottom: 35px;
        }

        .click-button {
            display: block;
            margin: auto;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: 8px solid rgba(255,255,255,0.12);
            background: linear-gradient(145deg, #ffcf33, #ff8a00);
            color: white;
            font-size: 34px;
            font-weight: 900;
            box-shadow:
                0 15px 0 #b95b00,
                0 30px 50px rgba(255, 142, 0, 0.3);
            transition: 0.1s;
        }

        .click-button:hover {
            transform: scale(1.03);
        }

        .click-button:active {
            transform: translateY(12px) scale(0.98);
            box-shadow:
                0 4px 0 #b95b00,
                0 15px 30px rgba(255, 142, 0, 0.25);
        }

        .click-info {
            text-align: center;
            margin-top: 35px;
            color: #8994bd;
        }

        .shop-title {
            font-size: 30px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .shop-subtitle {
            color: #8994bd;
            margin-bottom: 25px;
        }

        .shop-item {
            background: #151c3b;
            border: 1px solid #29325a;
            border-radius: 17px;
            padding: 20px;
            margin-bottom: 15px;
            transition: 0.2s;
        }

        .shop-item:hover {
            border-color: #5968db;
            transform: translateY(-2px);
        }

        .item-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .item-name {
            font-size: 20px;
            font-weight: bold;
        }

        .item-power {
            color: #70e6a0;
            margin-top: 5px;
        }

        .item-price {
            color: #ffd84d;
            margin-top: 10px;
            font-weight: bold;
        }

        .buy-button {
            border: none;
            border-radius: 10px;
            padding: 11px 17px;
            background: #5865f2;
            color: white;
            font-weight: bold;
        }

        .buy-button:hover {
            background: #707bff;
        }

        .buy-button:disabled {
            background: #343b5e;
            color: #707895;
            cursor: not-allowed;
        }

        .quantity {
            color: #777fa4;
            margin-top: 7px;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 25px;
        }

        .stat {
            background: #121831;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 12px;
            color: #737da5;
            margin-top: 5px;
        }

        /* RESPONSIVE */

        @media (max-width: 850px) {
            .game-content {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 550px) {
            header {
                padding: 0 15px;
            }

            .header-logo {
                font-size: 20px;
            }

            .username {
                display: none;
            }

            .clicker-panel,
            .shop-panel {
                padding: 20px;
            }

            .click-button {
                width: 210px;
                height: 210px;
            }

            .balance {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

<!-- ================= AUTH ================= -->

<div id="authPage" class="auth-container">

    <div class="auth-box">

        <div class="logo">🖱️ CLICKER</div>
        <div class="subtitle">Зарабатывай монеты и покупай улучшения</div>

        <div class="tabs">
            <button id="loginTab" class="tab active" onclick="showLogin()">
                Вход
            </button>

            <button id="registerTab" class="tab" onclick="showRegister()">
                Регистрация
            </button>
        </div>

        <input
            id="usernameInput"
            class="input"
            type="text"
            placeholder="Имя пользователя"
            autocomplete="username"
        >

        <input
            id="passwordInput"
            class="input"
            type="password"
            placeholder="Пароль"
            autocomplete="current-password"
        >

        <button
            id="authButton"
            class="auth-button"
            onclick="login()"
        >
            Войти
        </button>

        <div id="authMessage" class="message"></div>

    </div>

</div>


<!-- ================= GAME ================= -->

<div id="gamePage" class="game hidden">

    <header>

        <div class="header-logo">
            🖱️ CLICKER
        </div>

        <div class="user-area">

            <span id="currentUser" class="username"></span>

            <button class="logout" onclick="logout()">
                Выйти
            </button>

        </div>

    </header>


    <main class="game-content">

        <!-- CLICKER -->

        <section class="clicker-panel">

            <div class="balance-title">
                ТВОИ МОНЕТЫ
            </div>

            <div id="balance" class="balance">
                0
            </div>

            <div id="perClick" class="per-click">
                +1 за клик
            </div>

            <button
                id="clickButton"
                class="click-button"
                onclick="clickCoin()"
            >
                КЛИК!
            </button>

            <div class="click-info">
                Нажимай на кнопку, чтобы зарабатывать монеты
            </div>

            <div class="stats">

                <div class="stat">
                    <div id="totalClicks" class="stat-value">0</div>
                    <div class="stat-label">КЛИКОВ</div>
                </div>

                <div class="stat">
                    <div id="totalEarned" class="stat-value">0</div>
                    <div class="stat-label">ЗАРАБОТАНО</div>
                </div>

                <div class="stat">
                    <div id="upgradesCount" class="stat-value">0</div>
                    <div class="stat-label">УЛУЧШЕНИЙ</div>
                </div>

            </div>

        </section>


        <!-- SHOP -->

        <section class="shop-panel">

            <div class="shop-title">
                🛒 Магазин
            </div>

            <div class="shop-subtitle">
                Увеличивай количество монет за один клик
            </div>

            <div id="shop"></div>

        </section>

    </main>

</div>


<script>

    /*
        ==========================================
        CLICKER GAME
        ==========================================
    */


    let isRegisterMode = false;
    let currentUsername = null;


    /*
        =========================
        ТОВАРЫ МАГАЗИНА
        =========================

        power = сколько добавляется к клику

        price = стоимость улучшения
    */

    const shopItems = [

        {
            id: "plus1",
            name: "+1 к клику",
            power: 1,
            price: 10
        },

        {
            id: "plus100",
            name: "+100 к клику",
            power: 100,
            price: 1000
        },

        {
            id: "plus1000",
            name: "+1 000 к клику",
            power: 1000,
            price: 100000
        },

        {
            id: "plusMillion",
            name: "+1 000 000 к клику",
            power: 1000000,
            price: 10000000
        },

        {
            id: "plusBillion",
            name: "+1 000 000 000 к клику",
            power: 1000000000,
            price: 10000000000
        }

    ];


    /*
        =========================
        ФОРМАТИРОВАНИЕ ЧИСЕЛ
        =========================
    */

    function formatNumber(number) {

        if (number >= 1000000000000000000) {
            return (number / 1000000000000000000).toFixed(2) + " квинт.";
        }

        if (number >= 1000000000000000) {
            return (number / 1000000000000000).toFixed(2) + " квадр.";
        }

        if (number >= 1000000000000) {
            return (number / 1000000000000).toFixed(2) + " трлн";
        }

        if (number >= 1000000000) {
            return (number / 1000000000).toFixed(2) + " млрд";
        }

        if (number >= 1000000) {
            return (number / 1000000).toFixed(2) + " млн";
        }

        if (number >= 1000) {
            return (number / 1000).toFixed(2) + " тыс.";
        }

        return Math.floor(number).toLocaleString("ru-RU");
    }


    /*
        =========================
        ПОЛЬЗОВАТЕЛИ
        =========================
    */

    function getUsers() {

        return JSON.parse(
            localStorage.getItem("clicker_users") || "{}"
        );

    }


    function saveUsers(users) {

        localStorage.setItem(
            "clicker_users",
            JSON.stringify(users)
        );

    }


    /*
        =========================
        ПЕРЕКЛЮЧЕНИЕ ВХОД / РЕГИСТРАЦИЯ
        =========================
    */

    function showLogin() {

        isRegisterMode = false;

        document
            .getElementById("loginTab")
            .classList.add("active");

        document
            .getElementById("registerTab")
            .classList.remove("active");

        document
            .getElementById("authButton")
            .textContent = "Войти";

        document
            .getElementById("authMessage")
            .textContent = "";

    }


    function showRegister() {

        isRegisterMode = true;

        document
            .getElementById("registerTab")
            .classList.add("active");

        document
            .getElementById("loginTab")
            .classList.remove("active");

        document
            .getElementById("authButton")
            .textContent = "Создать аккаунт";

        document
            .getElementById("authMessage")
            .textContent = "";

    }


    /*
        =========================
        АВТОРИЗАЦИЯ
        =========================
    */

    function login() {

        const username =
            document
                .getElementById("usernameInput")
                .value
                .trim();

        const password =
            document
                .getElementById("passwordInput")
                .value;

        const message =
            document.getElementById("authMessage");


        if (!username || !password) {

            message.textContent =
                "Заполни имя пользователя и пароль.";

            return;
        }


        const users = getUsers();


        /*
            РЕГИСТРАЦИЯ
        */

        if (isRegisterMode) {

            if (username.length < 3) {

                message.textContent =
                    "Имя должно содержать минимум 3 символа.";

                return;
            }


            if (password.length < 4) {

                message.textContent =
                    "Пароль должен содержать минимум 4 символа.";

                return;
            }


            if (users[username]) {

                message.textContent =
                    "Такой пользователь уже существует.";

                return;
            }


            users[username] = {

                password: password,

                balance: 0,

                perClick: 1,

                totalClicks: 0,

                totalEarned: 0,

                upgrades: {}

            };


            saveUsers(users);

            currentUsername = username;

            localStorage.setItem(
                "clicker_current_user",
                username
            );

            openGame();

            return;
        }


        /*
            ВХОД
        */

        if (!users[username]) {

            message.textContent =
                "Пользователь не найден.";

            return;
        }


        if (users[username].password !== password) {

            message.textContent =
                "Неверный пароль.";

            return;
        }


        currentUsername = username;

        localStorage.setItem(
            "clicker_current_user",
            username
        );

        openGame();

    }


    /*
        =========================
        ОТКРЫТЬ ИГРУ
        =========================
    */

    function openGame() {

        document
            .getElementById("authPage")
            .classList.add("hidden");

        document
            .getElementById("gamePage")
            .classList.remove("hidden");

        document
            .getElementById("currentUser")
            .textContent =
                "👤 " + currentUsername;

        renderShop();

        updateGame();

    }


    /*
        =========================
        ВЫХОД
        =========================
    */

    function logout() {

        currentUsername = null;

        localStorage.removeItem(
            "clicker_current_user"
        );

        document
            .getElementById("gamePage")
            .classList.add("hidden");

        document
            .getElementById("authPage")
            .classList.remove("hidden");

        document
            .getElementById("usernameInput")
            .value = "";

        document
            .getElementById("passwordInput")
            .value = "";

        showLogin();

    }


    /*
        =========================
        ПОЛУЧИТЬ ТЕКУЩЕГО ИГРОКА
        =========================
    */

    function getCurrentPlayer() {

        const users = getUsers();

        return users[currentUsername];

    }


    /*
        =========================
        СОХРАНИТЬ ИГРОКА
        =========================
    */

    function saveCurrentPlayer(player) {

        const users = getUsers();

        users[currentUsername] = player;

        saveUsers(users);

    }


    /*
        =========================
        КЛИК
        =========================
    */

    function clickCoin() {

        const player = getCurrentPlayer();

        if (!player) return;


        player.balance += player.perClick;

        player.totalClicks++;

        player.totalEarned += player.perClick;


        saveCurrentPlayer(player);

        updateGame();


        /*
            Небольшая анимация
        */

        const button =
            document.getElementById("clickButton");

        button.style.transform =
            "scale(0.94)";

        setTimeout(() => {

            button.style.transform = "";

        }, 80);

    }


    /*
        =========================
        ПОКУПКА
        =========================
    */

    function buyUpgrade(id) {

        const item =
            shopItems.find(
                x => x.id === id
            );

        if (!item) return;


        const player = getCurrentPlayer();

        if (!player) return;


        if (player.balance < item.price) {

            alert("Недостаточно монет!");

            return;
        }


        /*
            Снимаем деньги
        */

        player.balance -= item.price;


        /*
            Добавляем силу клика
        */

        player.perClick += item.power;


        /*
            Счётчик конкретного улучшения
        */

        if (!player.upgrades[id]) {

            player.upgrades[id] = 0;

        }

        player.upgrades[id]++;


        saveCurrentPlayer(player);

        updateGame();

        renderShop();

    }


    /*
        =========================
        ОТРИСОВКА МАГАЗИНА
        =========================
    */

    function renderShop() {

        const shop =
            document.getElementById("shop");

        shop.innerHTML = "";


        shopItems.forEach(item => {

            const player =
                getCurrentPlayer();

            const owned =
                player?.upgrades?.[item.id] || 0;

            const canBuy =
                player &&
                player.balance >= item.price;


            const div =
                document.createElement("div");

            div.className = "shop-item";


            div.innerHTML = `

                <div class="item-top">

                    <div>

                        <div class="item-name">
                            ${item.name}
                        </div>

                        <div class="item-power">
                            Сила: +${formatNumber(item.power)}
                            за клик
                        </div>

                    </div>

                    <button
                        class="buy-button"
                        onclick="buyUpgrade('${item.id}')"
                        ${canBuy ? "" : "disabled"}
                    >
                        Купить
                    </button>

                </div>

                <div class="item-price">
                    💰 ${formatNumber(item.price)}
                </div>

                <div class="quantity">
                    Куплено: ${owned}
                </div>

            `;


            shop.appendChild(div);

        });

    }


    /*
        =========================
        ОБНОВЛЕНИЕ ИНТЕРФЕЙСА
        =========================
    */

    function updateGame() {

        const player =
            getCurrentPlayer();

        if (!player) return;


        document
            .getElementById("balance")
            .textContent =
                formatNumber(player.balance);


        document
            .getElementById("perClick")
            .textContent =
                "+" +
                formatNumber(player.perClick) +
                " за клик";


        document
            .getElementById("totalClicks")
            .textContent =
                formatNumber(player.totalClicks);


        document
            .getElementById("totalEarned")
            .textContent =
                formatNumber(player.totalEarned);


        const upgrades =
            Object.values(player.upgrades || {})
                .reduce(
                    (sum, value) => sum + value,
                    0
                );


        document
            .getElementById("upgradesCount")
            .textContent =
                formatNumber(upgrades);


        /*
            Обновляем доступность кнопок
        */

        renderShop();

    }


    /*
        =========================
        АВТОСОХРАНЕНИЕ
        =========================
    */

    setInterval(() => {

        if (currentUsername) {

            const player =
                getCurrentPlayer();

            if (player) {

                saveCurrentPlayer(player);

            }

        }

    }, 3000);


    /*
        =========================
        ENTER ДЛЯ ВХОДА
        =========================
    */

    document
        .getElementById("passwordInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    login();

                }

            }
        );


    /*
        =========================
        АВТОМАТИЧЕСКИЙ ВХОД
        =========================
    */

    const savedUser =
        localStorage.getItem(
            "clicker_current_user"
        );


    if (savedUser) {

        const users = getUsers();

        if (users[savedUser]) {

            currentUsername = savedUser;

            openGame();

        }

    }

</script>

</body>
</html>
