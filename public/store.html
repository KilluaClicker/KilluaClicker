<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Магазин — KilluaClicker</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="app">

    <!-- TOPBAR -->

    <header class="topbar">

        <div class="brand">

            <div class="brand-logo">
                K
            </div>

            <div>
                <div class="brand-name">
                    KilluaClicker
                </div>

                <div class="brand-subtitle">
                    CLICK • COMPETE • WIN
                </div>
            </div>

        </div>


        <nav class="nav">

            <a href="/" class="nav-link">
                Кликер
            </a>

            <a href="/store.html" class="nav-link active">
                Магазин
            </a>

            <a href="/clans.html" class="nav-link">
                Кланы
            </a>

            <a href="/top.html" class="nav-link">
                Топ
            </a>

            <a
                href="/admin.html"
                id="adminLink"
                class="nav-link admin-link"
                style="display:none;"
            >
                Админка
            </a>

        </nav>


        <div class="account">

            <span id="username">
                ...
            </span>

            <button
                type="button"
                id="logoutBtn"
                class="logout-btn"
            >
                Выйти
            </button>

        </div>

    </header>


    <!-- MAIN -->

    <main class="container">


        <!-- HEADER -->

        <section class="welcome">

            <div>

                <div class="small-title">
                    KILLUACLICKER STORE
                </div>

                <h1>
                    Магазин <span>кликов</span>
                </h1>

                <p>
                    Покупай клики за свои клики.
                    Чем больше покупка — тем больше награда.
                </p>

            </div>


            <div class="online">

                <span></span>

                ТВОЙ БАЛАНС:

                <strong id="balance">
                    0
                </strong>

            </div>

        </section>



        <!-- SHOP -->

        <section class="shop-section">

            <div class="shop-grid" id="shopGrid">

                <!-- Товары создаются через JS -->

            </div>

        </section>


    </main>

</div>


<!-- TOAST -->

<div
    id="toast"
    class="toast"
></div>


<script src="/store.js"></script>

</body>
</html>
