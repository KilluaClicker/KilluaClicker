<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KilluaClicker — Админка</title>

    <link rel="stylesheet" href="/style.css">

    <style>
        .admin-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .admin-title {
            margin: 0;
            font-size: 32px;
        }

        .admin-subtitle {
            color: #9994b8;
            margin-top: 7px;
        }

        .admin-search {
            background: #111022;
            border: 1px solid rgba(139,92,246,.2);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .admin-search input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(139,92,246,.25);
            background: #080611;
            color: #fff;
            outline: none;
            font-size: 15px;
        }

        .admin-search input:focus {
            border-color: #8b5cf6;
        }

        .admin-message {
            margin: 15px 0;
            padding: 12px 15px;
            border-radius: 12px;
            display: none;
        }

        .admin-message.show {
            display: block;
        }

        .admin-message.success {
            display: block;
            background: rgba(34,197,94,.12);
            color: #86efac;
        }

        .admin-message.error {
            display: block;
            background: rgba(239,68,68,.12);
            color: #fca5a5;
        }

        .admin-message.info {
            display: block;
            background: rgba(139,92,246,.12);
            color: #c4b5fd;
        }

        .admin-users {
            display: grid;
            gap: 18px;
        }

        .admin-user {
            background: linear-gradient(
                145deg,
                #111022,
                #17152d
            );
            border: 1px solid rgba(139,92,246,.2);
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 15px 40px rgba(0,0,0,.2);
        }

        .admin-user-top {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .admin-avatar {
            width: 52px;
            height: 52px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(
                135deg,
                #8b5cf6,
                #a855f7
            );
            color: white;
            font-weight: 800;
            font-size: 20px;
        }

        .admin-name {
            font-size: 20px;
            font-weight: 800;
        }

        .admin-status {
            margin-top: 4px;
            font-size: 13px;
            color: #22c55e;
        }

        .admin-status.banned {
            color: #ef4444;
        }

        .admin-fields {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        .admin-field label {
            display: block;
            margin-bottom: 7px;
            color: #9994b8;
            font-size: 13px;
        }

        .admin-field input {
            width: 100%;
            padding: 13px;
            border-radius: 11px;
            border: 1px solid rgba(139,92,246,.2);
            background: #080611;
            color: white;
            outline: none;
        }

        .admin-field input:focus {
            border-color: #8b5cf6;
        }

        .admin-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .admin-btn {
            border: 0;
            border-radius: 11px;
            padding: 11px 16px;
            color: white;
            cursor: pointer;
            font-weight: 700;
            transition: .15s;
        }

        .admin-btn:hover {
            transform: translateY(-1px);
        }

        .save-btn {
            background: #8b5cf6;
        }

        .ban-btn {
            background: #ef4444;
        }

        .unban-btn {
            background: #22c55e;
        }

        .reset-btn {
            background: #37324f;
        }

        .admin-empty {
            text-align: center;
            padding: 50px 20px;
            color: #9994b8;
            background: #111022;
            border-radius: 18px;
        }

        @media (max-width: 800px) {
            .admin-fields {
                grid-template-columns: 1fr;
            }

            .admin-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <div class="brand">
        <span class="brand-icon">⚡</span>
        <span>KilluaClicker</span>
    </div>

    <nav class="nav">
        <a href="/">Кликер</a>
        <a href="/store.html">Магазин</a>
        <a href="/clans.html">Кланы</a>
        <a href="/top.html">Топы</a>
    </nav>
</header>

<main class="admin-page">

    <div class="admin-header">
        <div>
            <h1 class="admin-title">⚙️ Админ-панель</h1>
            <div class="admin-subtitle">
                Управление игроками KilluaClicker
            </div>
        </div>
    </div>

    <div class="admin-search">
        <input
            id="adminSearch"
            type="text"
            placeholder="🔎 Поиск игрока по нику..."
            autocomplete="off"
        >
    </div>

    <div id="message" class="admin-message"></div>

    <div id="usersList" class="admin-users">
        <div class="admin-empty">
            Загрузка игроков...
        </div>
    </div>

</main>

<script src="/admin.js"></script>

</body>
</html>
