<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>KilluaClicker — Админка</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, #24134a 0%, #0d0b18 45%, #08070d 100%);
            color: white;
        }

        .admin-wrapper {
            width: min(1400px, 94%);
            margin: 0 auto;
            padding: 30px 0 60px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px;
            padding: 20px 24px;
            border: 1px solid rgba(168, 91, 255, .3);
            border-radius: 20px;
            background: rgba(20, 16, 35, .9);
            box-shadow: 0 15px 50px rgba(0,0,0,.3);
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
        }

        .logo span {
            color: #b86cff;
        }

        .admin-label {
            padding: 9px 14px;
            border-radius: 999px;
            background: rgba(176, 91, 255, .14);
            border: 1px solid rgba(176, 91, 255, .35);
            color: #d6adff;
            font-weight: 800;
        }

        .search-box {
            margin-bottom: 22px;
        }

        #search {
            width: 100%;
            padding: 17px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,.1);
            background: rgba(20,17,31,.9);
            color: white;
            outline: none;
            font-size: 16px;
        }

        #search:focus {
            border-color: #a95cff;
            box-shadow: 0 0 25px rgba(169,92,255,.15);
        }

        #message {
            display: none;
            margin-bottom: 20px;
            padding: 15px 18px;
            border-radius: 14px;
            background: rgba(78, 222, 151, .12);
            border: 1px solid rgba(78, 222, 151, .3);
            color: #8dffc5;
            font-weight: 700;
        }

        #message.error {
            background: rgba(255, 76, 76, .12);
            border-color: rgba(255, 76, 76, .3);
            color: #ff9b9b;
        }

        #users {
            display: grid;
            gap: 18px;
        }

        .user-card {
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 22px;
            padding: 22px;
            background: rgba(20, 17, 31, .92);
            box-shadow: 0 15px 40px rgba(0,0,0,.25);
        }

        .user-card.admin-card {
            border-color: rgba(190, 103, 255, .4);
            box-shadow:
                0 0 0 1px rgba(190,103,255,.08),
                0 15px 50px rgba(100,40,180,.12);
        }

        .user-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .user-name {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 21px;
            font-weight: 900;
        }

        .user-id {
            color: #777286;
            font-size: 13px;
        }

        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            padding: 7px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
        }

        .badge-admin {
            color: #e4c3ff;
            background: rgba(170, 82, 255, .16);
            border: 1px solid rgba(170, 82, 255, .3);
        }

        .badge-banned {
            color: #ffaaaa;
            background: rgba(255, 75, 75, .12);
            border: 1px solid rgba(255,75,75,.25);
        }

        .badge-ok {
            color: #9dffc8;
            background: rgba(66, 220, 142, .1);
            border: 1px solid rgba(66,220,142,.2);
        }

        .fields {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .field label {
            color: #a9a2b5;
            font-size: 12px;
            font-weight: 800;
        }

        .field input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 12px;
            background: #0e0c16;
            color: white;
            outline: none;
        }

        .field input:focus {
            border-color: #a95cff;
        }

        .give-section {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid rgba(255,255,255,.07);
        }

        .give-title {
            margin-bottom: 12px;
            color: #d4cbe0;
            font-size: 14px;
            font-weight: 900;
        }

        .give-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .give-row {
            display: flex;
            gap: 8px;
        }

        .give-row input {
            min-width: 0;
            flex: 1;
            padding: 13px 14px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 12px;
            background: #0e0c16;
            color: white;
            outline: none;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: 18px;
        }

        .admin-btn {
            border: 0;
            border-radius: 12px;
            padding: 12px 15px;
            color: white;
            font-weight: 800;
            cursor: pointer;
            transition: .15s;
        }

        .admin-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.1);
        }

        .save-btn {
            background: #7040c4;
        }

        .give-btn {
            background: #246b51;
        }

        .admin-give-btn {
            background: #8d4ad6;
        }

        .admin-remove-btn {
            background: #59336f;
        }

        .login-btn {
            background: #285c91;
        }

        .ban-btn {
            background: #873b3b;
        }

        .unban-btn {
            background: #296b4a;
        }

        .reset-btn {
            background: #5b5169;
        }

        .delete-btn {
            background: #a32f42;
        }

        .empty {
            padding: 40px;
            text-align: center;
            color: #8c8597;
            border-radius: 18px;
            border: 1px dashed rgba(255,255,255,.1);
        }

        @media (max-width: 900px) {
            .fields {
                grid-template-columns: 1fr;
            }

            .give-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .admin-wrapper {
                width: 92%;
                padding-top: 15px;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .user-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .give-row {
                flex-direction: column;
            }

            .admin-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="admin-wrapper">

        <header class="topbar">
            <div class="logo">
                Killua<span>Clicker</span>
            </div>

            <div class="admin-label">
                👑 АДМИН-ПАНЕЛЬ
            </div>
        </header>

        <div class="search-box">
            <input
                id="search"
                type="text"
                placeholder="🔎 Поиск пользователя..."
                autocomplete="off"
            >
        </div>

        <div id="message"></div>

        <section id="users">
            <div class="empty">
                Загрузка пользователей...
            </div>
        </section>

    </main>

    <script src="/admin.js"></script>
</body>
</html>
