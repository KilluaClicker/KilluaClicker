<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KilluaClicker — Админ-панель</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #25105c 0%, #0b0718 45%, #05030b 100%);
            color: white;
        }

        .container {
            width: min(1200px, 94%);
            margin: 30px auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            padding: 22px;
            border-radius: 20px;
            background: rgba(25, 16, 55, .85);
            border: 1px solid rgba(160, 100, 255, .3);
            box-shadow: 0 15px 50px rgba(0,0,0,.35);
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 6px 0 0;
            color: #aaa;
        }

        .back-btn {
            border: 0;
            border-radius: 12px;
            padding: 12px 18px;
            color: white;
            background: #6d35d9;
            cursor: pointer;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #8249ed;
        }

        .search-box {
            margin-bottom: 20px;
        }

        #search {
            width: 100%;
            padding: 16px 18px;
            border: 1px solid #3c2868;
            border-radius: 14px;
            outline: none;
            background: #110b22;
            color: white;
            font-size: 16px;
        }

        #search:focus {
            border-color: #8c4dff;
        }

        #message {
            min-height: 20px;
            margin-bottom: 15px;
            color: #caa8ff;
            font-weight: bold;
        }

        #users {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
            gap: 18px;
        }

        .user-card {
            padding: 20px;
            border-radius: 18px;
            background: rgba(18, 11, 38, .95);
            border: 1px solid #332052;
            box-shadow: 0 12px 35px rgba(0,0,0,.3);
        }

        .user-card.admin {
            border-color: #8c4dff;
            box-shadow: 0 0 25px rgba(140,77,255,.15);
        }

        .user-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .username {
            font-size: 21px;
            font-weight: bold;
        }

        .badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 5px 9px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-admin {
            background: #713bd1;
        }

        .badge-ban {
            background: #a72828;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat {
            padding: 12px;
            background: #0d081b;
            border-radius: 10px;
        }

        .stat-title {
            color: #8f86a5;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .field {
            margin-bottom: 10px;
        }

        .field label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
            font-size: 13px;
        }

        .field input {
            width: 100%;
            padding: 11px;
            border: 1px solid #38245b;
            border-radius: 9px;
            outline: none;
            background: #0b0615;
            color: white;
        }

        .field input:focus {
            border-color: #8c4dff;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        button {
            border: 0;
            border-radius: 9px;
            padding: 11px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .save {
            background: #5630b8;
        }

        .give {
            background: #176b45;
        }

        .power {
            background: #a56612;
        }

        .admin {
            background: #713bd1;
        }

        .remove-admin {
            background: #50306f;
        }

        .login-as {
            background: #2266a8;
        }

        .ban {
            background: #a72828;
        }

        .unban {
            background: #277d4e;
        }

        .reset {
            background: #704b1d;
        }

        .delete {
            background: #7d1824;
        }

        button:hover {
            filter: brightness(1.15);
        }

        .section-title {
            margin-top: 15px;
            margin-bottom: 8px;
            color: #bda9dd;
            font-size: 13px;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                align-items: stretch;
            }

            #users {
                grid-template-columns: 1fr;
            }

            .buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div>
            <h1>⚙️ Админ-панель</h1>
            <p>Управление пользователями KilluaClicker</p>
        </div>

        <button class="back-btn" onclick="location.href='/'">
            ← На сайт
        </button>
    </div>

    <div class="search-box">
        <input
            id="search"
            type="text"
            placeholder="🔎 Поиск игрока..."
            autocomplete="off"
        >
    </div>

    <div id="message"></div>

    <div id="users">
        <div class="empty">Загрузка игроков...</div>
    </div>

</div>

<script src="/admin.js"></script>

</body>
</html>
