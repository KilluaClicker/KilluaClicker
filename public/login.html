```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KilluaClicker — Вход</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            Killua<span>Clicker</span>
        </div>

        <div class="auth-subtitle">
            Кликер нового поколения
        </div>

        <!-- ВХОД -->

        <form id="loginForm">

            <h2>Вход</h2>

            <div class="auth-field">
                <label for="loginUsername">
                    Логин
                </label>

                <input
                    id="loginUsername"
                    type="text"
                    placeholder="Введите логин"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="auth-field">
                <label for="loginPassword">
                    Пароль
                </label>

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Введите пароль"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button
                class="auth-button"
                id="loginButton"
                type="submit"
            >
                Войти
            </button>

        </form>

        <div class="auth-divider">
            или
        </div>

        <button
            class="auth-secondary-button"
            id="showRegister"
            type="button"
        >
            Создать аккаунт
        </button>

        <!-- РЕГИСТРАЦИЯ -->

        <div
            id="registerBox"
            class="register-box"
            style="display: none;"
        >

            <h2>Регистрация</h2>

            <form id="registerForm">

                <div class="auth-field">
                    <label for="registerUsername">
                        Логин
                    </label>

                    <input
                        id="registerUsername"
                        type="text"
                        placeholder="Придумайте логин"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="auth-field">
                    <label for="registerPassword">
                        Пароль
                    </label>

                    <input
                        id="registerPassword"
                        type="password"
                        placeholder="Придумайте пароль"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button
                    class="auth-button"
                    id="registerButton"
                    type="submit"
                >
                    Зарегистрироваться
                </button>

            </form>

            <button
                class="auth-secondary-button"
                id="hideRegister"
                type="button"
            >
                Назад ко входу
            </button>

        </div>

        <div
            id="message"
            class="auth-message"
        ></div>

    </div>

    <script src="/login.js"></script>

</body>
</html>
```
