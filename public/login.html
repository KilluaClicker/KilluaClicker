<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KilluaClicker — Вход</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body class="auth-page">

    <main class="auth-card">

        <div class="auth-logo">
            Killua<span>Clicker</span>
        </div>

        <div class="auth-subtitle">
            Кликер с топами, магазином и кланами
        </div>


        <!-- ============================= -->
        <!-- LOGIN -->
        <!-- ============================= -->

        <form id="loginForm">

            <div class="auth-field">
                <label for="loginUsername">
                    Логин
                </label>

                <input
                    id="loginUsername"
                    type="text"
                    placeholder="Введите логин"
                    autocomplete="username"
                    maxlength="32"
                    required
                >
            </div>


            <div class="auth-field">
                <label for="loginPassword">
                    Пароль
                </label>

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Введите пароль"
                    autocomplete="current-password"
                    required
                >
            </div>


            <button
                id="loginButton"
                class="auth-button"
                type="submit"
            >
                Войти
            </button>

        </form>


        <div class="auth-divider">
            <span>или</span>
        </div>


        <!-- ============================= -->
        <!-- REGISTER BUTTON -->
        <!-- ============================= -->

        <button
            id="showRegister"
            class="auth-secondary-button"
            type="button"
        >
            Создать аккаунт
        </button>


        <!-- ============================= -->
        <!-- REGISTER -->
        <!-- ============================= -->

        <div
            id="registerBox"
            class="register-box"
            style="display: none;"
        >

            <div class="auth-divider">
                <span>Регистрация</span>
            </div>


            <form id="registerForm">

                <div class="auth-field">
                    <label for="registerUsername">
                        Новый логин
                    </label>

                    <input
                        id="registerUsername"
                        type="text"
                        placeholder="Придумайте логин"
                        autocomplete="username"
                        maxlength="32"
                        required
                    >
                </div>


                <div class="auth-field">
                    <label for="registerPassword">
                        Новый пароль
                    </label>

                    <input
                        id="registerPassword"
                        type="password"
                        placeholder="Придумайте пароль"
                        autocomplete="new-password"
                        required
                    >
                </div>


                <button
                    id="registerButton"
                    class="auth-button"
                    type="submit"
                >
                    Зарегистрироваться
                </button>

            </form>


            <button
                id="hideRegister"
                class="auth-secondary-button"
                type="button"
            >
                Назад ко входу
            </button>

        </div>


        <!-- ============================= -->
        <!-- MESSAGE -->
        <!-- ============================= -->

        <div
            id="message"
            class="auth-message"
        ></div>

    </main>


    <script src="/login.js"></script>

</body>
</html>
