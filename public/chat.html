<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KilluaClicker — Чат</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #25105c 0%, #0b0718 45%, #05030b 100%);
            color: white;
        }

        .container {
            width: min(900px, 94%);
            margin: 30px auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 20px;
            background: rgba(25, 16, 55, .9);
            border: 1px solid rgba(160, 100, 255, .3);
        }

        h1 {
            margin: 0;
        }

        .back {
            border: 0;
            border-radius: 10px;
            padding: 11px 16px;
            background: #6d35d9;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .chat {
            background: rgba(18, 11, 38, .95);
            border: 1px solid #332052;
            border-radius: 20px;
            overflow: hidden;
        }

        #messages {
            height: 550px;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            padding: 12px;
            margin-bottom: 10px;
            background: #0d081b;
            border-radius: 12px;
        }

        .name {
            color: #b57cff;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .time {
            color: #777;
            font-size: 11px;
            float: right;
        }

        .text {
            overflow-wrap: anywhere;
        }

        .send {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #332052;
        }

        #messageInput {
            flex: 1;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #38245b;
            outline: none;
            background: #0b0615;
            color: white;
        }

        #sendBtn {
            border: 0;
            border-radius: 10px;
            padding: 0 22px;
            background: #6d35d9;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #sendBtn:hover,
        .back:hover {
            filter: brightness(1.15);
        }

        #status {
            padding: 10px 15px;
            color: #aaa;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .send {
                flex-direction: column;
            }

            #sendBtn {
                padding: 13px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div>
            <h1>💬 Общий чат</h1>
            <div id="username">Загрузка...</div>
        </div>

        <button class="back" onclick="location.href='/'">
            ← Назад
        </button>
    </div>

    <div class="chat">

        <div id="messages">
            Загрузка сообщений...
        </div>

        <div id="status"></div>

        <form class="send" id="chatForm">
            <input
                id="messageInput"
                maxlength="500"
                autocomplete="off"
                placeholder="Написать сообщение..."
            >

            <button id="sendBtn" type="submit">
                Отправить
            </button>
        </form>

    </div>

</div>

<script src="/chat.js"></script>

</body>
</html>
