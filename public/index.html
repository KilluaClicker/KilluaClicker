<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KilluaClicker</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

<header class="topbar">

  <div class="logo">
    ⚡ KilluaClicker
  </div>

  <nav class="nav-buttons">

    <button id="homeButton" class="nav-button active">
      ⚡ Кликер
    </button>

    <button id="topButton" class="nav-button">
      🏆 Топ
    </button>

    <button id="adminLink" class="nav-button hidden">
      🛡️ Админка
    </button>

  </nav>

</header>


<main>

  <!-- АВТОРИЗАЦИЯ -->

  <section id="authScreen" class="auth-screen">

    <div class="auth-card">

      <div class="auth-logo">
        ⚡
      </div>

      <h1>KilluaClicker</h1>

      <p class="auth-subtitle">
        Кликер нового поколения
      </p>

      <div class="auth-tabs">

        <button id="loginTab" class="auth-tab active">
          Войти
        </button>

        <button id="registerTab" class="auth-tab">
          Регистрация
        </button>

      </div>


      <!-- ВХОД -->

      <div id="loginForm">

        <input
          id="loginUsername"
          type="text"
          placeholder="Логин"
          maxlength="32">

        <input
          id="loginPassword"
          type="password"
          placeholder="Пароль">

        <button id="loginButton" class="main-button">
          ⚡ Войти
        </button>

      </div>


      <!-- РЕГИСТРАЦИЯ -->

      <div id="registerForm" class="hidden">

        <input
          id="registerUsername"
          type="text"
          placeholder="Придумай логин"
          maxlength="32">

        <input
          id="registerPassword"
          type="password"
          placeholder="Придумай пароль">

        <button id="registerButton" class="main-button">
          🚀 Создать аккаунт
        </button>

      </div>


      <div id="authMessage" class="auth-message"></div>

    </div>

  </section>


  <!-- ИГРА -->

  <section id="gameScreen" class="game-screen hidden">


    <!-- ПРОФИЛЬ ВВЕРХУ -->

    <div class="player-card">

      <div class="player-info">

        <div class="player-avatar">
          ⚡
        </div>

        <div>

          <div class="player-label">
            Игрок
          </div>

          <div id="playerName" class="player-name">
            —
          </div>

        </div>

      </div>


      <button id="logoutButton" class="logout-button">
        Выйти
      </button>

    </div>


    <!-- КЛИКИ -->

    <div class="score-card">

      <div class="score-label">
        Твои клики
      </div>

      <div id="score" class="score">
        0
      </div>

      <div class="score-description">
        Нажимай на кнопку и набирай очки
      </div>

    </div>


    <!-- КНОПКА КЛИКА -->

    <div class="click-area">

      <button id="clickButton" class="click-button">

        <span class="click-icon">
          ⚡
        </span>

        КЛИК

      </button>

    </div>


    <!-- ПРОФИЛЬ -->

    <div class="profile-card">

      <div class="profile-title">
        👤 Профиль
      </div>

      <div class="profile-stat">

        <span>
          Всего кликов
        </span>

        <strong id="profileClicks">
          0
        </strong>

      </div>

    </div>


    <!-- ТОП -->

    <section id="topSection" class="content-section">

      <div class="section-header">

        <div>

          <div class="section-title">
            🏆 Топ игроков
          </div>

          <div class="section-subtitle">
            Лучшие игроки KilluaClicker
          </div>

        </div>

      </div>


      <div id="leaderboard" class="leaderboard">

        <div class="loading">
          Загрузка игроков...
        </div>

      </div>

    </section>


  </section>

</main>


<script src="/app.js"></script>


<!-- НАВИГАЦИЯ НЕ ЗАВИСИТ ОТ app.js -->

<script>

  document.addEventListener("DOMContentLoaded", function () {

    const homeButton = document.getElementById("homeButton");

    const topButton = document.getElementById("topButton");

    const adminButton = document.getElementById("adminLink");


    if (homeButton) {

      homeButton.onclick = function () {

        window.location.href = "/";

      };

    }


    if (topButton) {

      topButton.onclick = function () {

        const section =
          document.getElementById("topSection");

        if (section) {

          section.scrollIntoView({
            behavior: "smooth"
          });

        }

      };

    }


    if (adminButton) {

      adminButton.onclick = function () {

        window.location.href = "/admin.html";

      };

    }

  });

</script>

</body>
</html>
