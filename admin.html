<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KilluaClicker — Admin Panel</title>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;

    font-family:
        Inter,
        Arial,
        sans-serif;

    color:#fff;

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(0,234,255,.15),
            transparent 30%
        ),
        radial-gradient(
            circle at 100% 100%,
            rgba(124,58,237,.18),
            transparent 35%
        ),
        #060810;
}


/* =========================
   BACKGROUND
========================= */

body::before{
    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            rgba(255,255,255,.015) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.015) 1px,
            transparent 1px
        );

    background-size:35px 35px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent
        );
}


/* =========================
   LAYOUT
========================= */

.app{
    width:min(1250px,94%);

    margin:auto;

    padding:25px 0 60px;
}


/* =========================
   HEADER
========================= */

.header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;

    margin-bottom:25px;
}

.brand{
    display:flex;

    align-items:center;

    gap:14px;
}

.logo{
    width:52px;
    height:52px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            #00eaff,
            #5965ff
        );

    color:#06101b;

    font-size:24px;

    font-weight:900;

    box-shadow:
        0 0 30px
        rgba(0,234,255,.2);
}

.brand h1{
    margin:0;

    font-size:22px;
}

.brand p{
    margin:4px 0 0;

    color:#78839a;

    font-size:13px;
}


.back{
    border:1px solid rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.04);

    color:#fff;

    padding:12px 17px;

    border-radius:13px;

    cursor:pointer;

    font-weight:700;

    transition:.2s;
}

.back:hover{
    background:rgba(255,255,255,.08);

    transform:translateY(-2px);
}


/* =========================
   ADMIN BADGE
========================= */

.admin-badge{

    display:inline-flex;

    align-items:center;

    gap:7px;

    padding:7px 11px;

    margin-top:8px;

    border-radius:999px;

    background:
        rgba(0,234,255,.08);

    border:
        1px solid
        rgba(0,234,255,.2);

    color:#00eaff;

    font-size:12px;

    font-weight:800;
}


/* =========================
   STATS
========================= */

.stats{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

    margin-bottom:25px;
}

.stat{

    padding:20px;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.02)
        );

    border:
        1px solid
        rgba(255,255,255,.07);

    backdrop-filter:blur(15px);

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.15);
}

.stat-top{

    color:#7f8ba3;

    font-size:12px;

    font-weight:700;

    margin-bottom:10px;
}

.stat-number{

    font-size:28px;

    font-weight:900;
}

.cyan{
    color:#00eaff;
}

.yellow{
    color:#ffe600;
}

.purple{
    color:#b47cff;
}


/* =========================
   CONTROL BAR
========================= */

.toolbar{

    display:flex;

    align-items:center;

    gap:12px;

    margin-bottom:20px;
}

.search{

    flex:1;

    position:relative;
}

.search span{

    position:absolute;

    left:15px;

    top:50%;

    transform:
        translateY(-50%);

    color:#69758c;
}

.search input{

    width:100%;
   padding:
        15px
        15px
        15px
        44px;

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius:15px;

    outline:none;

    background:
        rgba(255,255,255,.035);

    color:white;

    font-size:14px;
}

.search input:focus{

    border-color:
        rgba(0,234,255,.4);

    box-shadow:
        0 0 0 3px
        rgba(0,234,255,.05);
}


/* =========================
   PLAYER GRID
========================= */

.players{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:16px;
}


/* =========================
   PLAYER CARD
========================= */

.player{

    padding:20px;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            rgba(20,27,45,.92),
            rgba(10,14,26,.92)
        );

    border:
        1px solid
        rgba(255,255,255,.07);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.18);

    transition:
        transform .2s,
        border .2s;
}

.player:hover{

    transform:
        translateY(-3px);

    border-color:
        rgba(0,234,255,.18);
}


.player-head{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-bottom:18px;
}


.player-info{

    display:flex;

    align-items:center;

    gap:13px;
}


.avatar{

    width:48px;
    height:48px;

    flex-shrink:0;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            #192641,
            #101522
        );

    border:
        1px solid
        rgba(255,255,255,.08);

    color:#00eaff;

    font-weight:900;

    font-size:19px;
}


.nick{

    font-size:16px;

    font-weight:900;
}

.role{

    margin-top:5px;

    color:#7c879d;

    font-size:11px;
}

.role.admin{

    color:#00eaff;

    font-weight:800;
}


.crown{

    color:#ffe600;

    font-size:20px;
}


/* =========================
   FIELDS
========================= */

.fields{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:9px;

    margin-bottom:12px;
}

.field label{

    display:block;

    margin-bottom:6px;

    color:#727e95;

    font-size:10px;

    font-weight:800;
}

.field input{

    width:100%;

    padding:11px 10px;

    border:
        1px solid
        rgba(255,255,255,.06);

    border-radius:11px;

    outline:none;

    background:#080c16;

    color:white;

    font-size:13px;
}

.field input:focus{

    border-color:
        rgba(0,234,255,.35);
}


/* =========================
   BUTTONS
========================= */

.actions{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:9px;
}


.action{

    border:0;

    padding:12px;

    border-radius:12px;

    color:white;

    background:
        rgba(255,255,255,.055);

    cursor:pointer;

    font-size:12px;

    font-weight:800;

    transition:.2s;
}

.action:hover{

    background:
        rgba(255,255,255,.1);

    transform:
        translateY(-1px);
}


.save{

    background:
        linear-gradient(
            135deg,
            #00eaff,
            #4169ff
        );

    color:#06101b;
}

.save:hover{

    background:
        linear-gradient(
            135deg,
            #36efff,
            #5b78ff
        );
}


.give{

    background:
        rgba(0,234,255,.08);

    color:#00eaff;

    border:
        1px solid
        rgba(0,234,255,.16);
}


.remove{

    background:
        rgba(255,65,105,.08);

    color:#ff6c8b;

    border:
        1px solid
        rgba(255,65,105,.16);
}


/* =========================
   EMPTY
========================= */

.empty{

    grid-column:
        1 / -1;

    text-align:center;

    padding:60px 20px;

    border-radius:22px;

    background:
        rgba(255,255,255,.025);

    border:
        1px dashed
        rgba(255,255,255,.1);

    color:#69758c;
}


/* =========================
   TOAST
========================= */

.toast{

    position:fixed;

    left:50%;

    bottom:25px;
transform:
        translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    padding:13px 18px;

    border-radius:14px;

    background:
        rgba(20,27,43,.96);

    border:
        1px solid
        rgba(255,255,255,.1);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.35);

    transition:.25s;

    font-size:13px;

    font-weight:700;

    z-index:100;
}

.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .stats{

        grid-template-columns:
            1fr;
    }

    .players{

        grid-template-columns:
            1fr;
    }

}


@media(max-width:500px){

    .header{

        align-items:flex-start;

    }

    .fields{

        grid-template-columns:
            1fr;
    }

    .actions{

        grid-template-columns:
            1fr;
    }

    .brand h1{

        font-size:18px;
    }

}

</style>
</head>


<body>


<div class="app">


    <!-- HEADER -->

    <header class="header">

        <div class="brand">

            <div class="logo">
                👑
            </div>

            <div>

                <h1>
                    KilluaClicker
                </h1>

                <p>
                    Панель управления
                </p>

                <div class="admin-badge">
                    🛡️ ADMIN ACCESS
                </div>

            </div>

        </div>


        <button
            class="back"
            onclick="location.href='index.html'"
        >
            ← Вернуться
        </button>

    </header>



    <!-- STATS -->

    <section class="stats">

        <div class="stat">

            <div class="stat-top">
                👥 ИГРОКОВ
            </div>

            <div
                id="totalPlayers"
                class="stat-number cyan"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-top">
                🪙 МОНЕТ В ИГРЕ
            </div>

            <div
                id="totalCoins"
                class="stat-number yellow"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-top">
                👑 АДМИНИСТРАТОРОВ
            </div>

            <div
                id="totalAdmins"
                class="stat-number purple"
            >
                0
            </div>

        </div>

    </section>



    <!-- SEARCH -->

    <div class="toolbar">

        <div class="search">

            <span>🔎</span>

            <input
                id="search"
                type="text"
                placeholder="Поиск игрока..."
                autocomplete="off"
            >

        </div>

    </div>



    <!-- PLAYERS -->

    <section
        id="players"
        class="players"
    ></section>


</div>



<div
    id="toast"
    class="toast"
></div>



<script>


/* =====================================
   НАСТРОЙКИ
===================================== */


const MAIN_ADMIN =
    "Killua666";


/* =====================================
   ТЕКУЩИЙ ПОЛЬЗОВАТЕЛЬ
===================================== */


const currentUser =
    localStorage.getItem("currentUser");


/* =====================================
   ПОЛУЧЕНИЕ USERS
===================================== */


function getUsers(){

    try{

        const users =
            JSON.parse(
                localStorage.getItem("users") || "[]"
            );


        return Array.isArray(users)
            ? users
            : [];

    }

    catch{

        return [];

    }

}


/* =====================================
   СОХРАНЕНИЕ
===================================== */


function saveUsers(users){

    localStorage.setItem(
        "users",
        JSON.stringify(users)
    );

}


/* =====================================
   ПРОВЕРКА АДМИНА
===================================== */


function isAdmin(){

    if(currentUser === MAIN_ADMIN){

        return true;
 }


    const users =
        getUsers();


    const user =
        users.find(
            u => u.nick === currentUser
        );


    return !!(
        user &&
        user.admin === true
    );

}


/* =====================================
   ЗАЩИТА СТРАНИЦЫ
===================================== */


if(
    !currentUser ||
    !isAdmin()
){

    document.body.innerHTML = 

        <div style="
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#060810;
            color:white;
            font-family:Arial;
            text-align:center;
            padding:30px;
        ">

            <div>

                <div style="
                    font-size:70px;
                    margin-bottom:20px;
                ">
                    🔒
                </div>

                <h1>
                    Доступ запрещён
                </h1>

                <p style="
                    color:#7f8ba5;
                ">
                    У этого аккаунта нет
                    прав администратора.
                </p>

                <button
                    onclick="location.href='index.html'"
                    style="
                        margin-top:15px;
                        padding:14px 22px;
                        border:0;
                        border-radius:13px;
                        background:#00eaff;
                        color:#06101b;
                        font-weight:bold;
                        cursor:pointer;
                    "
                >
                    Вернуться
                </button>

            </div>

        </div>

    ;

    throw new Error(
        "Access denied"
    );

}


/* =====================================
   TOAST
===================================== */


let toastTimer;


function toast(message){

    const element =
        document.getElementById("toast");


    element.textContent =
        message;


    element.classList.add("show");


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            ()=>{
                element.classList.remove("show");
            },
            2200
        );

}


/* =====================================
   ФОРМАТ ЧИСЕЛ
===================================== */


function formatNumber(number){

    return Number(
        number || 0
    ).toLocaleString("ru-RU");

}


/* =====================================
   ЗАЩИТА HTML
===================================== */


function escapeHTML(text){

    const div =
        document.createElement("div");


    div.textContent =
        String(text ?? "");


    return div.innerHTML;

}


/* =====================================
   РЕНДЕР
===================================== */


function render(){

    const users =
        getUsers();


    const container =
        document.getElementById(
            "players"
        );


    const search =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();


    const filtered =
        users.filter(
            user =>
                String(
                    user.nick || ""
                )
                .toLowerCase()
                .includes(search)
        );


    /* =========================
       СТАТИСТИКА
    ========================= */


    document.getElementById(
        "totalPlayers"
    ).textContent =
        users.length;


    const totalCoins =
        users.reduce(
            (sum,user)=>
                sum +
                Number(
                    user.coins || 0
                ),
            0
        );


    document.getElementById(
        "totalCoins"
    ).textContent =
        formatNumber(totalCoins);


    const totalAdmins =
        users.filter(
            user =>
                user.nick === MAIN_ADMIN ||
                user.admin === true
        ).length;


    document.getElementById(
        "totalAdmins"
    ).textContent =
        totalAdmins;
 /* =========================
       ЕСЛИ НИКОГО НЕТ
    ========================= */


    if(filtered.length === 0){

        container.innerHTML = 

            <div class="empty">

                <div style="
                    font-size:45px;
                    margin-bottom:12px;
                ">
                    🔎
                </div>

                Игроки не найдены.

            </div>

        ;

        return;

    }


    /* =========================
       КАРТОЧКИ
    ========================= */


    container.innerHTML = "";


    filtered.forEach(
        user => {

            const realIndex =
                users.indexOf(user);


            const mainAdmin =
                user.nick === MAIN_ADMIN;


            const initials =
                String(
                    user.nick || "?"
                )
                .charAt(0)
                .toUpperCase();


            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "player";


            card.innerHTML = 

                <div class="player-head">

                    <div class="player-info">

                        <div class="avatar">
                            ${escapeHTML(initials)}
                        </div>

                        <div>

                            <div class="nick">
                                ${escapeHTML(user.nick)}
                            </div>

                            <div class="
                                role
                                ${mainAdmin || user.admin
                                    ? "admin"
                                    : ""}
                            ">

                                ${
                                    mainAdmin
                                    ? "👑 Главный администратор"
                                    : user.admin
                                    ? "🛡️ Администратор"
                                    : "👤 Игрок"
                                }

                            </div>

                        </div>

                    </div>


                    ${
                        mainAdmin
                        ? 
                            <div class="crown">
                                👑
                            </div>
                        `
                        : ""
                    }

                </div>


                <div class="fields">

                    <div class="field">

                        <label>
                            🪙 БАЛАНС
                        </label>

                        <input
                            id="coins-${realIndex}"
                            type="number"
                            min="0"
                            value="${Number(user.coins) || 0}"
                        >

                    </div>


                    <div class="field">

                        <label>
                            ⚡ ЗА КЛИК
                        </label>

                        <input
                            id="power-${realIndex}"
                            type="number"
                            min="1"
                            value="${Number(user.power) || 1}"
                        >

                    </div>


                    <div class="field">

                        <label>
                            🤖 АВТО / СЕК
                        </label>

                        <input
                            id="auto-${realIndex}"
                            type="number"
                            min="0"
                            value="${Number(user.auto) || 0}"
                        >

                    </div>

                </div>


                <div class="actions">
   <button
                        class="action save"
                        onclick="
                            savePlayer(${realIndex})
                        "
                    >
                        💾 Сохранить
                    </button>


                    ${
                        !mainAdmin
                        ? 

                            <button
                                class="
                                    action
                                    ${
                                        user.admin
                                        ? "remove"
                                        : "give"
                                    }
                                "
                                onclick="
                                    toggleAdmin(${realIndex})
                                "
                            >

                                ${
                                    user.admin
                                    ? "🚫 Снять админку"
                                    : "👑 Выдать админку"
                                }

                            </button>

                        
                        : 
                            <button
                                class="action"
                                disabled
                                style="
                                    opacity:.45;
                                    cursor:not-allowed;
                                "
                            >
                                👑 Главный админ
                            </button>
                        
                    }

                </div>

            ;


            container.appendChild(
                card
            );

        }
    );

}


/* =====================================
   СОХРАНЕНИЕ ИГРОКА
===================================== */


function savePlayer(index){

    const users =
        getUsers();


    const user =
        users[index];


    if(!user){

        toast(
            "❌ Игрок не найден"
        );

        return;

    }


    const coins =
        Number(
            document.getElementById(
                coins-${index}
            ).value
        );


    const power =
        Number(
            document.getElementById(
                power-${index}
            ).value
        );


    const auto =
        Number(
            document.getElementById(
                auto-${index}
            ).value
        );


    if(
        !Number.isFinite(coins) ||
        !Number.isFinite(power) ||
        !Number.isFinite(auto)
    ){

        toast(
            "❌ Проверь значения"
        );

        return;

    }


    if(
        coins < 0 ||
        power < 1 ||
        auto < 0
    ){

        toast(
            "❌ Нельзя использовать отрицательные значения"
        );

        return;

    }


    user.coins =
        Math.floor(coins);


    user.power =
        Math.floor(power);


    user.auto =
        Math.floor(auto);


    saveUsers(users);


    toast(
        ✅ ${user.nick} сохранён
    );


    render();

}


/* =====================================
   АДМИНКА
===================================== */


function toggleAdmin(index){

    const users =
        getUsers();


    const user =
        users[index];


    if(!user){

        return;

    }


    if(
        user.nick === MAIN_ADMIN
    ){

        toast(
            "👑 Главного администратора нельзя изменить"
        );

        return;

    }


    user.admin =
        !Boolean(user.admin);


    saveUsers(users);


    if(user.admin){

        toast(
            👑 ${user.nick} получил админку
        );

    }
    else{

        toast(
            🚫 Админка ${user.nick} снята`
        );

    }


    render();

}


/* =====================================
   ПОИСК
===================================== */


document
    .getElementById("search")
    .addEventListener(
        "input",
        render
    );
/* =====================================
   ЗАПУСК
===================================== */


render();

</script>

</body>
</html>
