<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Админ-панель — KilluaClicker</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 20% 10%,
            #163c63,
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 90%,
            #4a164f,
            transparent 35%
        ),
        #060814;

    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: min(900px, 92%);
    margin: auto;
    padding: 25px 0 60px;
}

.back {
    padding: 12px 18px;
    border: 0;
    border-radius: 12px;

    background: #ffffff12;
    color: white;

    cursor: pointer;
}

h1 {
    margin-top: 30px;
    font-size: 40px;
}

.admin-title {
    color: #00eaff;
}

.warning {
    padding: 15px;
    margin: 20px 0;

    border-radius: 15px;

    background: #ffcc0012;
    border: 1px solid #ffcc0030;

    color: #ffd84d;
}

.player {
    margin-top: 15px;
    padding: 20px;

    border-radius: 20px;

    background: #101626;
    border: 1px solid #ffffff10;
}

.player-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 10px;
}

.nick {
    font-size: 20px;
    font-weight: 900;
}

.admin {
    color: #00eaff;
    font-size: 12px;
}

input {
    width: 100%;

    margin-top: 8px;
    padding: 13px;

    border: 0;
    border-radius: 10px;

    background: #080c18;
    color: white;

    outline: none;
}

input:focus {
    box-shadow: 0 0 0 2px #00eaff55;
}

.grid {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(180px, 1fr)
        );

    gap: 10px;

    margin-top: 15px;
}

.action {
    padding: 13px;

    border: 0;
    border-radius: 11px;

    background: #182039;
    color: white;

    cursor: pointer;

    font-weight: bold;
}

.action:hover {
    background: #223052;
}

.give-admin {
    background:
        linear-gradient(
            135deg,
            #00eaff,
            #006cff
        );

    color: #06101c;
}

.remove-admin {
    background: #712238;
}

.save {
    background:
        linear-gradient(
            135deg,
            #ffe600,
            #ff7900
        );

    color: #111;
}

.status {
    margin-top: 10px;

    color: #7e8ba5;

    font-size: 13px;
}

</style>
</head>

<body>

<div class="container">

<button
    class="back"
    onclick="location.href='index.html'"
>
← Меню
</button>


<h1>
<span class="admin-title">👑 ADMIN</span>
 PANEL
</h1>

<p>
Управление игроками KilluaClicker
</p>


<div class="warning">

⚠️ Админ-панель доступна только
аккаунту <b>Killua666</b> и игрокам,
которым он выдал права администратора.

</div>


<div id="players"></div>

</div>


<script>

/* =====================================
   НАСТРОЙКИ
===================================== */

const MAIN_ADMIN = "Killua666";


/* =====================================
   ПОЛУЧЕНИЕ ТЕКУЩЕГО ПОЛЬЗОВАТЕЛЯ
===================================== */

const currentUser =
    localStorage.getItem("currentUser");


/* =====================================
   ПОЛУЧЕНИЕ ПОЛЬЗОВАТЕЛЕЙ
===================================== */

function getUsers() {

    try {

        return JSON.parse(
            localStorage.getItem("users") || "[]"
        );

    } catch {

        return [];

    }

}


/* =====================================
   СОХРАНЕНИЕ
===================================== */

function saveUsers(users) {

    localStorage.setItem(
        "users",
        JSON.stringify(users)
    );

}


/* =====================================
   ПРОВЕРКА АДМИНА
===================================== */

function isAdmin() {

    if (currentUser === MAIN_ADMIN) {

        return true;

    }


    const users = getUsers();

    const user =
        users.find(
            u => u.nick === currentUser
        );


    return user && user.admin === true;

}
/* =====================================
   ЕСЛИ НЕТ ДОСТУПА
===================================== */

if (!currentUser || !isAdmin()) {

    document.body.innerHTML = 

        <div style="
            color:white;
            font-family:Arial;
            text-align:center;
            padding:100px 20px;
        ">

            <h1>🚫 Доступ запрещён</h1>

            <p>
                У тебя нет прав администратора.
            </p>

            <button
                onclick="location.href='index.html'"
                style="
                    padding:15px 25px;
                    border:0;
                    border-radius:12px;
                    cursor:pointer;
                "
            >
                Вернуться
            </button>

        </div>

    ;

    throw new Error("Admin access denied");

}


/* =====================================
   СОЗДАНИЕ КАРТОЧКИ ИГРОКА
===================================== */

function renderPlayers() {

    const container =
        document.getElementById("players");

    container.innerHTML = "";


    const users = getUsers();


    if (users.length === 0) {

        container.innerHTML =
            "<p>Нет зарегистрированных игроков.</p>";

        return;

    }


    users.forEach((user, index) => {

        const card =
            document.createElement("div");

        card.className = "player";


        const isMainAdmin =
            user.nick === MAIN_ADMIN;


        card.innerHTML = 

            <div class="player-header">

                <div>

                    <div class="nick">
                        👤 ${escapeHTML(user.nick)}
                    </div>

                    ${
                        user.admin || isMainAdmin

                        ? 
                        <div class="admin">
                            👑 АДМИНИСТРАТОР
                        </div>
                        

                        : 
                        <div class="status">
                            Обычный игрок
                        </div>
                        
                    }

                </div>

            </div>


            <div class="grid">

                <div>

                    <label>
                        🪙 Баланс
                    </label>

                    <input
                        id="coins-${index}"
                        type="number"
                        value="${Number(user.coins) || 0}"
                    >

                </div>


                <div>

                    <label>
                        ⚡ Сила клика
                    </label>

                    <input
                        id="power-${index}"
                        type="number"
                        value="${Number(user.power) || 1}"
                    >

                </div>


                <div>

                    <label>
                        🤖 Автокликер
                    </label>

                    <input
                        id="auto-${index}"
                        type="number"
                        value="${Number(user.auto) || 0}"
                    >

                </div>

            </div>


            <div class="grid">

                <button
                    class="action save"
                    onclick="savePlayer(${index})"
                >
                    💾 СОХРАНИТЬ
                </button>


                ${
                    !isMainAdmin

                    ? 

                    <button
                        class="action ${
                            user.admin
                            ? "remove-admin"
                            : "give-admin"
                        }"
                        onclick="toggleAdmin(${index})"
                    >

                        ${
                            user.admin
                            ? "🚫 СНЯТЬ АДМИНКУ"
                            : "👑 ВЫДАТЬ АДМИНКУ"
                        }

                    </button>

                    `

                    : ""
}

            </div>

        ;


        container.appendChild(card);

    });

}


/* =====================================
   СОХРАНЕНИЕ ИГРОКА
===================================== */

function savePlayer(index) {

    const users = getUsers();

    const user = users[index];


    const coins =
        Number(
            document.getElementById(
                coins-${index}
            ).value
        );


    const power =
        Number(
            document.getElementById(
                power-${index}
            ).value
        );


    const auto =
        Number(
            document.getElementById(
                auto-${index}
            ).value
        );


    if (
        !Number.isFinite(coins) ||
        !Number.isFinite(power) ||
        !Number.isFinite(auto)
    ) {

        alert(
            "❌ Введены неправильные значения."
        );

        return;

    }


    if (
        coins < 0 ||
        power < 1 ||
        auto < 0
    ) {

        alert(
            "❌ Значения не могут быть отрицательными."
        );

        return;

    }


    user.coins =
        Math.floor(coins);

    user.power =
        Math.floor(power);

    user.auto =
        Math.floor(auto);


    saveUsers(users);


    alert(
        ✅ Данные игрока ${user.nick} сохранены!
    );


    renderPlayers();

}


/* =====================================
   ВЫДАТЬ / СНЯТЬ АДМИНКУ
===================================== */

function toggleAdmin(index) {

    const users = getUsers();

    const user = users[index];


    if (user.nick === MAIN_ADMIN) {

        alert(
            "Главному администратору нельзя снять права."
        );

        return;

    }


    user.admin =
        !user.admin;


    saveUsers(users);


    if (user.admin) {

        alert(
            👑 ${user.nick} теперь администратор!
        );

    } else {

        alert(
            🚫 Админка у ${user.nick} снята.`
        );

    }


    renderPlayers();

}


/* =====================================
   ЗАЩИТА ТЕКСТА
===================================== */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* =====================================
   ЗАПУСК
===================================== */

renderPlayers();

</script>

</body>
</html>
