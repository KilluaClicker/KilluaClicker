<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Регистрация — KilluaClicker</title>
<style>
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:Arial;color:white;background:radial-gradient(circle at 20% 20%,#006b82,transparent 35%),radial-gradient(circle at 80% 80%,#452080,transparent 35%),#060810;
}
.box{
width:min(400px,92%);padding:30px;border-radius:28px;
background:#101625e8;border:1px solid #ffffff12;box-shadow:0 25px 80px #0008;
}
h1{text-align:center;margin:0 0 8px;color:#00eaff}
p{text-align:center;color:#7e899f}
input{
width:100%;padding:15px;margin:7px 0;border:1px solid #ffffff12;
border-radius:13px;background:#080c16;color:white;outline:none;
}
button{
width:100%;padding:15px;margin-top:10px;border:0;border-radius:14px;
background:linear-gradient(135deg,#00eaff,#5268ff);color:#06101b;
font-weight:bold;cursor:pointer;
}
.back{background:#ffffff09;color:white}
.error{color:#ff6d8d;text-align:center;min-height:20px}
</style>
</head>
<body>
<div class="box">
<h1>KilluaClicker</h1>
<p>Создание аккаунта</p>

<input id="nick" placeholder="Ник" maxlength="20">
<input id="password" type="password" placeholder="Пароль">

<div id="error" class="error"></div>

<button onclick="register()">📝 СОЗДАТЬ АККАУНТ</button>
<button class="back" onclick="location.href='index.html'">← Назад</button>
</div>

<script>
function getUsers(){
try{
return JSON.parse(localStorage.getItem("users")||"[]");
}catch{return [];}
}

function register(){
const nick=document.getElementById("nick").value.trim();
const password=document.getElementById("password").value;
const error=document.getElementById("error");

if(nick.length<3){
error.textContent="❌ Ник минимум 3 символа";
return;
}

if(password.length<4){
error.textContent="❌ Пароль минимум 4 символа";
return;
}

const users=getUsers();

if(users.some(u=>u.nick.toLowerCase()===nick.toLowerCase())){
error.textContent="❌ Такой ник уже занят";
return;
}

users.push({
nick:nick,
password:password,
coins:0,
power:1,
auto:0,
admin:nick==="Killua666"
});

localStorage.setItem("users",JSON.stringify(users));
localStorage.setItem("currentUser",nick);

location.href="index.html";
}
</script>
</body>
</html>
