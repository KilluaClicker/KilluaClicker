<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Профиль — KilluaClicker</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<header>
    <div class="logo">⚡ KilluaClicker</div>
    <div class="balance">
        🪙 <span id="headerCoins">0</span>
    </div>
</header>

<div class="card center">

<div class="avatar" id="avatar">
    👤
</div>

<h2 id="profileName">
    Игрок
</h2>

<div class="stats">

<div class="stat">
<span>🪙 МОНЕТЫ</span>
<b id="profileCoins">0</b>
</div>

<div class="stat">
<span>⚡ СИЛА</span>
<b id="profilePower">1</b>
</div>

<div class="stat">
<span>🤖 АВТО</span>
<b id="profileAuto">0</b>
</div>

</div>

<br>

<input
    id="nick"
    maxlength="20"
    placeholder="Твой ник">

<button class="save" onclick="saveProfile()">
💾 СОХРАНИТЬ НИК
</button>

<br><br>

<p>Выбери аватарку:</p>

<input
    type="file"
    accept="image/*"
    onchange="uploadAvatar(event)">

</div>

</div>

<nav class="nav">
    <a href="index.html">🏠<br>Меню</a>
    <a href="game.html">⚡<br>Игра</a>
    <a href="shop.html">🛒<br>Магазин</a>
    <a href="profile.html">👤<br>Профиль</a>
    <a href="settings.html">⚙️<br>Настройки</a>
</nav>

<script src="script.js"></script>

</body>
</html>
